:780px}@media(max-width:680px){.assignment-head{flex-direction:column;align-items:flex-start}.grade-form{grid-template-columns:1fr}.submission-meta{align-items:flex-start}.assignment-card{padding:14px}}

</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
let installEvent=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e});async function installApp(){if(!installEvent){notify('Para instalarla, usa el menú “Añadir a pantalla de inicio” de tu navegador.');return}installEvent.prompt();await installEvent.userChoice;installEvent=null}if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));const state={token:localStorage.getItem('lumina_token')||'',user:JSON.parse(localStorage.getItem('lumina_user')||'null'),page:'inicio',messages:[],notes:JSON.parse(localStorage.getItem('lumina_notes')||'[]'),subject:'',level:'',quizIndex:0,quizScore:0,quizChoice:null,learningIndex:0,learningChoice:null,learningAnswers:[],classes:[],classesLoading:false,assignments:[],assignmentsLoading:false};const subjectsByLevel={Primaria:['Español','Matemáticas','Ciencias Naturales','Historia','Geografía','Formación Cívica y Ética','Artes','Educación Física','Inglés'],Secundaria:['Español','Matemáticas','Biología','Física','Química','Historia','Geografía','Formación Cívica y Ética','Inglés','Tecnología','Artes','Educación Física'],Preparatoria:['Matemáticas','Lengua y Comunicación','Inglés','Física','Química','Biología','Historia','Ciencias Sociales','Humanidades','Filosofía','Informática y TIC','Ética','Administración','Contabilidad','Economía','Literatura'],Universidad:['Administración','Arquitectura','Artes y Diseño','Biología','Bioquímica','Ciencia de Datos','Ciencias de la Comunicación','Ciencias Políticas','Contaduría','Derecho','Economía','Educación','Enfermería','Filosofía','Física','Historia','Ingeniería Civil','Ingeniería en Sistemas','Ingeniería Industrial','Ingeniería Mecánica','Lenguas','Matemáticas','Medicina','Mercadotecnia','Psicología','Química','Sociología'],Posgrado:['Seminario de Investigación','Metodología de la Investigación','Estadística Aplicada','Métodos Cualitativos','Métodos Cuantitativos','Ética de la Investigación','Taller de Tesis','Especialidad Disciplinar']};let activeGuide=null,guideTab='summary',guideLoading=false,guideError='',flippedCards=new Set(),quizSelections={},guideRequestId=0;
state.notes=[];state.aiNoteIds=[];state.notesLoadedUserId=null;
const icons={inicio:'⌂',chat:'✧',apuntes:'▤',progreso:'◷'};
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function apiRequest(url,{method='GET',body}={}){const headers={...(state.token?{authorization:'Bearer '+state.token}:{})};if(body!==undefined)headers['content-type']='application/json';const r=await fetch('/api'+url,{method,headers,...(body!==undefined?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Ocurrió un error.');return d}async function api(url,body){return apiRequest(url,{method:body===undefined?'GET':'POST',body})}
function notify(s){const n=document.createElement('div');n.className='flash';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),3100)}
function saveUser(d){state.token=d.token;state.user=d.user;localStorage.setItem('lumina_token',d.token);localStorage.setItem('lumina_user',JSON.stringify(d.user));render();loadNotes()}
function brand(){return `<div class="brand"><span class="brandmark">✳</span> aula lúmina</div>`}
function render(){if(!state.user){landing();return} shell()}
function landing(){app.innerHTML=`<main class="public"><header class="public-nav">${brand()}<div class="public-actions"><button class="btn btn-outline install-btn" onclick="installApp()">Instalar</button><button class="btn btn-outline" onclick="openLogin()">Iniciar sesión</button><button class="btn" onclick="openRegister()">Crear cuenta</button></div></header><section class="public-hero"><div class="public-copy"><span class="eyebrow">✳ &nbsp;Tu espacio para aprender</span><h1>Entiende más.<br><em>Llega más lejos.</em></h1><p>Una compañía para tu camino académico. Haz preguntas, explora ideas y aprende a tu ritmo, en cualquier etapa.</p><div class="public-cta"><button class="btn" onclick="openRegister()">Empieza a aprender &nbsp;→</button><button class="btn btn-outline" onclick="openLogin()">Ya tengo cuenta</button></div><p class="public-note">✧ Para estudiantes y docentes · de primaria a universidad</p><div class="features"><span>Aprendizaje personalizado</span><span>Un lugar para tus apuntes</span><span>En español</span></div></div><div class="visual-card"><div class="float-card f1">✦ <b>Una duda menos</b><span>Y una idea más clara</span></div><div class="book-stack">📚</div><div class="float-card f2">◉ <b>A tu propio ritmo</b><span>Tu aprendizaje, a tu manera</span></div></div></section></main>`}
function shell(){const name=state.user.name.split(' ')[0],student=state.user.profile==='alumno',style=state.user.details?.learningStyle;app.innerHTML=`<aside class="sidebar">${brand()}<div class="group-label">Tu espacio</div><nav class="nav">${[['inicio','⌂','Inicio'],...(state.user.profile==='profesor'?[['alumnos','♙','Alumnos']]:[]),['clases','▦','Mis clases'],['tareas','☷','Tareas'],['chat','✧','Tutor IA'],['apuntes','▤','Mis apuntes'],['progreso','◷','Mi progreso']].map(([id,ic,t])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')"><span class="ico">${ic}</span>${t}</button>`).join('')}</nav><div class="sidebar-bottom">${student?`<div class="upgrade"><b>${style?'Sigue aprendiendo 🌱':'Conoce cómo aprendes 🌱'}</b><p>${style?'Explora nuevas ideas a tu ritmo.':'Descubre qué formas de estudio te resultan más cómodas.'}</p><button class="btn btn-outline btn-small" onclick="${style?'startQuiz()':'startLearningQuiz()'}">${style?'Repasar conceptos':'Test de aprendizaje'}</button></div>`:`<div class="upgrade"><b>Un espacio para enseñar 🌿</b><p>Prepara explicaciones y recursos para tus clases.</p><button class="btn btn-outline btn-small" onclick="go('clases')">Ver mis grupos</button></div>`}<div class="avatar-row">${avatarMarkup(state.user.avatar,state.user.name)}<div class="user-text"><b>${esc(name)}</b><small>${student?'Estudiante':'Docente'} · ${esc(state.user.details?.level||'Tu espacio')}</small></div></div></div></aside><main class="main"><header class="topbar"><span class="crumb">Espacio de aprendizaje &nbsp; / &nbsp; <b>${pageName()}</b></span><div class="topright"><select class="theme-select" onchange="setTheme(this.value)"><option value="green">◉ Olivo</option><option value="lilac">◉ Lavanda</option><option value="blue">◉ Cielo</option><option value="rose">◉ Rosa</option></select><button class="btn btn-outline btn-small install-btn" onclick="installApp()">Instalar app</button><button class="round" title="Cerrar sesión" onclick="logout()">↗</button></div></header><div id="view"></div></main>`;renderPage()}
function pageName(){return {inicio:'Inicio',alumnos:'Alumnos',clases:'Mis clases',tareas:'Tareas',chat:'Tutor IA',apuntes:'Mis apuntes',progreso:state.user?.profile==='profesor'?'Mi espacio docente':'Mi progreso'}[state.page]}
function go(p){state.page=p;shell();if(p==='clases'||p==='alumnos')loadClasses();if(p==='tareas')loadAssignments()}
function setTheme(t){const c={green:['#f7f5f0','#4d654e','#e8ede2'],lilac:['#f6f3f8','#78658e','#eeeaf5'],blue:['#f2f6f8','#507589','#e3edf1'],rose:['#faf3f1','#936c64','#f4e7e2']}[t];document.documentElement.style.setProperty('--paper',c[0]);document.documentElement.style.setProperty('--green',c[1]);document.documentElement.style.setProperty('--soft',c[2]);localStorage.setItem('lumina_theme',t)}
function renderPage(){const v=$('#view');if(!v)return;if(state.page==='inicio')v.innerHTML=home();else if(state.page==='alumnos')v.innerHTML=studentsPage();else if(state.page==='clases')v.innerHTML=classesPage();else if(state.page==='tareas')v.innerHTML=assignmentsPage();else if(state.page==='chat')v.innerHTML=chat();else if(state.page==='apuntes')v.innerHTML=notesPage();else v.innerHTML=progressPage()}
function avatarMarkup(image,name,extra=''){const initial=String(name||'U').trim()[0]?.toUpperCase()||'U';return image?`<div class="avatar ${extra}"><img src="${esc(image)}" alt="Foto de ${esc(name||'usuario')}"></div>`:`<div class="avatar ${extra}" aria-hidden="true">${esc(initial)}</div>`}
function profilePhotoCard(){return `<section class="panel profile-photo-card"><div class="profile-photo-row">${avatarMarkup(state.user.avatar,state.user.name,'avatar-large')}<div class="photo-copy"><h3>Foto de perfil</h3><p>Es opcional. Puedes agregarla, cambiarla o quitarla cuando quieras.</p></div><button class="btn btn-outline btn-small" onclick="editProfilePhoto()">${state.user.avatar?'Cambiar foto':'Agregar foto'}</button></div></section>`}
let pendingAvatar=null;
function editProfilePhoto(){pendingAvatar=state.user.avatar||null;modal(`<div class="modal-top"><h2>Foto de perfil</h2><button class="close" onclick="closeModal()" aria-label="Cerrar">×</button></div><p>Agregar una foto es opcional. La ajustaremos para que se vea bien en tu perfil.</p><div class="photo-preview" id="avatar-preview">${avatarMarkup(pendingAvatar,state.user.name,'avatar-large')}</div><div class="photo-buttons"><label class="btn btn-outline btn-small">Elegir foto<input type="file" accept="image/*" onchange="readProfilePhoto(event)" style="display:none"></label><button class="btn btn-outline btn-small" id="remove-profile-avatar" onclick="clearPendingAvatar()" ${pendingAvatar?'':'disabled'}>Quitar foto</button></div><div class="photo-buttons" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-outline btn-small" onclick="closeModal()">Cancelar</button><button class="btn btn-small" id="save-profile-avatar" onclick="saveProfileAvatar()" ${pendingAvatar?'':'disabled'}>Guardar foto</button></div>`)}
function readProfilePhoto(event){const file=event.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){notify('Elige un archivo de imagen.');event.target.value='';return}if(file.size>10*1024*1024){notify('La foto original debe pesar menos de 10 MB.');event.target.value='';return}const reader=new FileReader();reader.onerror=()=>notify('No pude leer esa foto. Prueba con otro archivo.');reader.onload=()=>{const image=new Image();image.onerror=()=>notify('No pude abrir esa foto. Prueba con una imagen JPG, PNG o WebP.');image.onload=()=>{const compress=(maxSize,quality)=>{const scale=Math.min(1,maxSize/Math.max(image.naturalWidth,image.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));const context=canvas.getContext('2d');if(!context)return null;context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',quality)};let data=compress(240,.76);if(!data||!data.startsWith('data:image/jpeg;base64,')){notify('No pude preparar esa foto.');return}if(data.length>160000)data=compress(180,.52);if(!data||data.length>160000){notify('No se pudo reducir la foto lo suficiente. Prueba con otra imagen.');return}pendingAvatar=data;updateAvatarPreview()};image.src=reader.result};reader.readAsDataURL(file);event.target.value=''}
function updateAvatarPreview(){const preview=$('#avatar-preview');if(preview)preview.innerHTML=avatarMarkup(pendingAvatar,state.user.name,'avatar-large');const save=$('#save-profile-avatar');if(save)save.disabled=!pendingAvatar&&!state.user.avatar;const remove=$('#remove-profile-avatar');if(remove)remove.disabled=!pendingAvatar&&!state.user.avatar}
function clearPendingAvatar(){pendingAvatar=null;updateAvatarPreview()}
async function saveProfileAvatar(){try{const result=await api('/profile/avatar',{avatar:pendingAvatar});state.user.avatar=result.avatar;localStorage.setItem('lumina_user',JSON.stringify(state.user));closeModal();render();notify(result.avatar?'Foto de perfil guardada.':'Foto de perfil eliminada.')}catch(error){notify(error.message)}}
function studentRosterRow(student){const preferences=student.learningPreferences||[];return `<div class="roster-row student-roster-row">${avatarMarkup(student.avatar,student.name||'Alumno')}<div class="student-roster-copy"><b>${esc(student.name||'Pendiente de registro')}</b><small>${student.matricula?`Matrícula: ${esc(student.matricula)}`:student.registered?'Cuenta vinculada':'Esperando registro con esa matrícula'}</small></div><div class="roster-tag">${preferences.length?esc(preferences.join(' · ')):'Sin preferencia registrada'}</div></div>`}
function studentsPage(){if(state.classesLoading)return `<div class="view-title"><span class="eyebrow">TUS GRUPOS</span><h1>Alumnos</h1><p>Cargando alumnos…</p></div>`;return `<div class="view-title"><span class="eyebrow">TUS GRUPOS</span><h1>Alumnos</h1><p>Consulta a tus alumnos por grupo, materia, matrícula y preferencia de aprendizaje.</p></div>${state.classes.map(c=>`<section class="panel student-group"><div class="student-group-head"><h3>${esc(c.subject)} · ${esc(c.name)}</h3><span class="roster-tag">${c.students.length} alumnos</span></div><p class="class-meta">${esc(c.academicLevel)} · ${esc(c.classType)}</p><div class="class-roster">${c.students.map(studentRosterRow).join('')||'<div class="empty">Todavía no hay alumnos en este grupo.</div>'}</div></section>`).join('')||'<section class="panel empty">Primero crea una clase o agrega matrículas desde Mis clases.</section>'}`}function home(){const student=state.user.profile==='alumno',details=state.user.details||{},style=details.learningStyle;const stats=student?`<div class="stat"><div class="stat-label">Preferencia de aprendizaje</div><div class="stat-value" style="font-size:16px">${esc(style?.preferences?.join(' · ')||'Por descubrir')}<small>${style?'orientativa':'test inicial'}</small></div></div><div class="stat"><div class="stat-label">Apuntes guardados</div><div class="stat-value">${state.notes.length}<small>documentos</small></div></div><div class="stat"><div class="stat-label">Diagnóstico académico</div><div class="stat-value">${details.quizScore!=null?details.quizScore+'%':'—'} <small>${details.quizScore!=null?'resultado':'opcional'}</small></div></div>`:`<div class="stat"><div class="stat-label">Apuntes reunidos</div><div class="stat-value">${state.notes.length}<small>documentos</small></div></div><div class="stat"><div class="stat-label">Nivel académico</div><div class="stat-value" style="font-size:16px">${esc(details.level||'Por elegir')}</div></div><div class="stat"><div class="stat-label">Materias que impartes</div><div class="stat-value" style="font-size:14px">${esc(details.subjects||'Por agregar')}</div></div>`;const nextTitle=student?'Tu próximo paso':'Tu espacio docente';const nextText=student?(!style?'Responde unas preguntas breves para conocer tus preferencias de estudio. El resultado es orientativo, no una etiqueta.':details.quizScore==null?'Tu perfil de aprendizaje está listo. Si quieres, completa también el diagnóstico académico o empieza a estudiar.':'Sigue aprendiendo a tu ritmo. Guarda tus apuntes o conversa con tu tutora sobre cualquier tema.'):'Conversa con Lúmina para preparar explicaciones, ejemplos y recursos para tus clases.';const nextAction=student?(!style?'startLearningQuiz()':details.quizScore==null?'startQuiz()':"go('apuntes')"):"go('chat')";const nextLabel=student?(!style?'Conocer cómo aprendo →':details.quizScore==null?'Diagnóstico opcional →':'Explorar mis apuntes →'):'Preparar una clase →';return `<section class="welcome"><span class="eyebrow">${new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</span><h1>Qué gusto verte, ${esc(state.user.name.split(' ')[0])} <span style="font-size:22px">☀️</span></h1><p>Un buen momento para descubrir algo nuevo.</p></section><section class="hero"><div class="hero-copy"><div class="hero-kicker">✦ &nbsp; TU COMPAÑERA DE ESTUDIO</div><h2>La curiosidad es el comienzo de todo.</h2><p>¿Qué te gustaría entender hoy?</p><button class="btn" onclick="go('chat')">Conversar con Lúmina &nbsp;→</button></div><div class="hero-art">🌱</div></section>${profilePhotoCard()}<div class="section-head"><h3>Tu espacio de hoy</h3><button class="text-link" onclick="go('progreso')">Ver mi avance &nbsp;→</button></div><div class="grid-stats">${stats}</div><div class="content-grid"><section class="panel"><div class="panel-head"><h3>Explora una materia</h3><button class="text-link" onclick="go('chat')">Preguntar →</button></div><div class="subject-list">${[['∑','Matemáticas','Descubre el porqué, paso a paso','74%'],['◈','Ciencias','Explora cómo funciona el mundo','52%'],['▱','Lengua y literatura','Lee, escribe, expresa tus ideas','38%']].map(a=>`<div class="subject-row"><div class="subject-icon">${a[0]}</div><div class="subject-meta"><b>${a[1]}</b><small>${a[2]}</small></div><div class="progress"><i style="width:${a[3]}"></i></div></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><h3>${nextTitle}</h3><span style="font-size:18px">🌿</span></div><p style="font-size:12px;line-height:1.75;color:var(--muted)">${nextText}</p><button class="btn btn-outline btn-small" onclick="${nextAction}">${nextLabel}</button></section></div>`}

function notesPage(){const mine=state.notes.map((note,index)=>({note,index})).filter(item=>item.note.isOwner),community=state.notes.map((note,index)=>({note,index})).filter(item=>!item.note.isOwner);return `<div class="view-title"><span class="eyebrow">TU BIBLIOTECA</span><h1>Mis apuntes</h1><p>Guarda tus apuntes en la nube y compártelos solo con las clases elegidas o con toda la comunidad.</p></div><section class="panel"><div class="panel-head"><h3>Tus apuntes</h3><div class="note-actions"><button class="btn btn-outline btn-small" onclick="openManualNote()">＋ Escribir apunte</button><button class="btn btn-small" onclick="go('chat');setTimeout(()=>$('#fileUp')?.click(),100)">＋ Añadir archivo</button></div></div><p style="color:var(--muted);font-size:11px;line-height:1.7">Al guardar, elige si el apunte queda privado, se comparte con una o varias de tus clases, o se hace visible para todos.</p>${mine.map(({note,index})=>noteRow(note,index)).join('')||'<div class="empty">Todavía no tienes apuntes. Puedes escribir uno sin subir un archivo.</div>'}</section>${community.length?`<section class="panel" style="margin-top:15px"><div class="panel-head"><h3>Apuntes compartidos contigo</h3><span class="roster-tag">${community.length}</span></div><p style="color:var(--muted);font-size:11px">Solo aparecen apuntes de la comunidad y de las clases a las que perteneces.</p>${community.map(({note,index})=>noteRow(note,index)).join('')}</section>`:''}<section class="panel" style="margin-top:15px"><h3>Estudia con tus apuntes o con conocimiento general</h3><p style="color:var(--muted);font-size:11px;margin:8px 0 13px">Selecciona apuntes en el chat para que la IA los use como referencia. También puedes preguntarle cualquier tema sin elegir apuntes.</p><button class="btn btn-outline btn-small" onclick="go('chat')">Abrir tutora IA →</button></section>`}
async function openManualNote(index=null,draft=null){const existing=Number.isInteger(index)?state.notes[index]:null;if(existing&&!existing.isOwner){notify('Solo la persona que publicó este apunte puede editarlo.');return}try{const data=await api('/classes');state.classes=data.classes||[]}catch(error){if(!state.classes.length)notify('No se pudieron cargar tus clases: '+error.message)}const source=existing||draft||{},selectedIds=new Set((source.sharedClassIds||[]).map(Number));modal(`<div class="modal-top"><h2>${existing?'Editar apunte':'Escribir un apunte'}</h2><button class="close" onclick="closeModal()">×</button></div><p>Escribe o pega tus apuntes; no necesitas subir un archivo. Decide quién podrá verlos.</p><form class="form" onsubmit="saveManualNote(event)"><input type="hidden" name="noteIndex" value="${existing?index:''}"><label>Nombre del apunte<input name="name" required maxlength="100" placeholder="Ej. Fotosíntesis · Ciencias" value="${esc(source.name||'')}"></label><label>Texto<textarea name="text" required minlength="20" maxlength="25000" rows="8" placeholder="Pega o escribe aquí tus apuntes…${draft&&!draft.text?' Si subiste un PDF o documento, pega aquí su contenido.':''}">${esc(source.text||'')}</textarea></label><label>Quién puede verlo<select name="visibility" onchange="toggleNoteClassPicker(this.value)"><option value="private" ${source.visibility==='class'||source.visibility==='general'?'':'selected'}>Solo yo · privado</option><option value="class" ${source.visibility==='class'?'selected':''}>Solo una o varias de mis clases</option><option value="general" ${source.visibility==='general'?'selected':''}>Toda la comunidad</option></select></label><div id="note-class-picker" style="display:${source.visibility==='class'?'block':'none'};border:1px solid var(--line);border-radius:10px;padding:12px"><b style="font-size:11px">Elige las clases que podrán verlo</b><div style="display:grid;gap:8px;margin-top:10px">${state.classes.length?state.classes.map(c=>`<label style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:400"><input style="width:auto;margin:0" type="checkbox" name="classIds" value="${Number(c.id)}" ${selectedIds.has(Number(c.id))?'checked':''}><span>${esc(c.subject)} · ${esc(c.name)} (${esc(c.academicLevel)})</span></label>`).join(''):'<p style="margin:0;color:var(--muted);font-size:11px">Todavía no tienes clases disponibles. Únete a una clase o crea un grupo antes de compartir el apunte.</p>'}</div></div><p style="color:var(--muted);font-size:11px">Los apuntes privados solo aparecen en tu cuenta. Los de clase solo los ven sus integrantes y docente. Los compartidos con toda la comunidad son visibles para cualquier usuario.</p><button class="btn">Guardar apunte</button></form>`)}

async function saveManualNote(event){event.preventDefault();const form=event.currentTarget,name=form.elements.name.value.trim(),text=form.elements.text.value.trim(),visibility=form.elements.visibility.value,index=form.elements.noteIndex.value===''?-1:Number(form.elements.noteIndex.value),classIds=[...form.querySelectorAll('input[name="classIds"]:checked')].map(input=>Number(input.value));if(text.length<20){notify('Pega o escribe al menos 20 caracteres para guardar el apunte.');return}if(visibility==='class'&&!classIds.length){notify('Selecciona al menos una clase para compartir este apunte.');return}const old=index>=0?state.notes[index]:null;try{const payload={name,text,visibility,classIds:visibility==='class'?classIds:[],studyGuide:null};const result=old?await apiRequest('/notes/'+old.id,{method:'PUT',body:payload}):await api('/notes',{...payload,clientId:(crypto.randomUUID&&crypto.randomUUID())||('note-'+Date.now()+'-'+Math.random().toString(36).slice(2))});if(old)state.notes[index]=result.note;else state.notes.unshift(result.note);closeModal();renderPage();notify(visibility==='general'?'Apunte guardado y compartido con toda la comunidad.':visibility==='class'?'Apunte compartido con las clases seleccionadas.':'Apunte guardado de forma privada.')}catch(error){notify(error.message)}}
function openStudyGuide(index){const note=state.notes[index];if(!note)return;if(!note.text){modal(`<div class="modal-top"><h2>Falta el texto del apunte</h2><button class="close" onclick="closeModal()">×</button></div><p>Este archivo se guardó en tu biblioteca, pero el navegador no pudo leer su contenido. Pega el texto del documento para que Lúmina pueda estudiarlo.</p><button class="btn" onclick="closeModal();openManualNote(${index})">Pegar texto</button>`);return}const requestId=++guideRequestId;activeGuide={name:note.name,index,content:note.text.slice(0,12000),guide:note.studyGuide||null};guideTab='summary';guideLoading=!activeGuide.guide;guideError='';flippedCards=new Set();quizSelections={};modal(studyModalHtml());document.querySelector('.overlay .modal').dataset.study='yes';if(activeGuide.guide)return;api('/study-guide',{content:activeGuide.content,sourceName:note.name,subject:state.subject,level:state.user.details?.level||state.level}).then(d=>{if(requestId!==guideRequestId)return;activeGuide.guide=d.guide;state.notes[index].studyGuide=d.guide;if(note.isOwner)apiRequest('/notes/'+state.notes[index].id,{method:'PUT',body:{name:note.name,text:note.text,visibility:note.visibility,classIds:note.sharedClassIds||[],studyGuide:d.guide}}).then(saved=>{state.notes[index]=saved.note}).catch(error=>notify('La guía se creó, pero no se pudo guardar: '+error.message));guideLoading=false;renderStudyModal()}).catch(e=>{if(requestId!==guideRequestId)return;guideError=e.message;guideLoading=false;renderStudyModal()})}
function studyModalHtml(){const modalTop=`<div class="modal-top"><div><span class="eyebrow">GUÍA DE ESTUDIO</span><h2>${esc(activeGuide?.name||'Mis apuntes')}</h2></div><button class="close" onclick="closeModal()">×</button></div>`;if(guideLoading)return `${modalTop}<div class="study-loading"><div class="study-spinner"></div><b>Lúmina está preparando tu guía…</b><p>Creando resumen, tarjetas y preguntas a partir de tus apuntes.</p></div>`;if(guideError)return `${modalTop}<div class="study-error"><p>${esc(guideError)}</p><button class="btn btn-outline btn-small" onclick="openStudyGuide(${activeGuide.index})">Intentar de nuevo</button></div>`;if(!activeGuide?.guide)return `${modalTop}<p>No hay una guía para mostrar.</p>`;const g=activeGuide.guide,tabs=[['summary','Resumen'],['cards','Tarjetas'],['quiz','Cuestionario']];let body='';if(guideTab==='summary')body=`<div class="study-summary">${g.summary.split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;else if(guideTab==='cards')body=`<p class="study-hint">Toca cada tarjeta para descubrir la respuesta.</p><div class="study-cards">${g.flashcards.map((c,i)=>`<button class="study-card ${flippedCards.has(i)?'flipped':''}" onclick="flipStudyCard(${i})"><small>${flippedCards.has(i)?'RESPUESTA':'CONCEPTO'} · ${i+1}</small><span>${esc(flippedCards.has(i)?c.back:c.front)}</span></button>`).join('')}</div>`;else{const score=Object.entries(quizSelections).filter(([i,a])=>g.quiz[Number(i)]?.answerIndex===a).length;body=`<div class="study-score">${Object.keys(quizSelections).length} de ${g.quiz.length} respondidas · ${score} correctas</div><div class="study-questions">${g.quiz.map((q,i)=>`<section class="study-question"><b>${i+1}. ${esc(q.question)}</b><div class="study-options">${q.options.map((option,j)=>`<button class="${quizSelections[i]===j?'chosen':''} ${quizSelections[i]!==undefined&&j===q.answerIndex?'correct':''} ${quizSelections[i]===j&&j!==q.answerIndex?'incorrect':''}" ${quizSelections[i]!==undefined?'disabled':''} onclick="answerStudyQuestion(${i},${j})">${esc(option)}</button>`).join('')}</div>${quizSelections[i]!==undefined?`<p class="study-explanation">${quizSelections[i]===q.answerIndex?'✓ ¡Correcto!':'La respuesta correcta está marcada arriba.'} ${esc(q.explanation)}</p>`:''}</section>`).join('')}</div>`}return `${modalTop}<div class="study-tabs">${tabs.map(([id,label])=>`<button class="${guideTab===id?'active':''}" onclick="studyModalTab('${id}')">${label}</button>`).join('')}</div><div class="study-content">${body}</div>`}

async function addMatriculas(event,id){event.preventDefault();const form=event.currentTarget;try{const result=await api(`/classes/${id}/matriculas`,{matriculas:form.elements.matriculas.value});state.classes=result.classes||state.classes;renderPage();notify(`Se revisaron ${result.added} matrícula(s); las cuentas existentes quedaron vinculadas.`)}catch(error){notify(error.message)}}
async function joinClass(event){event.preventDefault();const form=event.currentTarget;try{const result=await api('/classes/join',{code:form.elements.code.value});state.classes=result.classes||state.classes;renderPage();notify('Ya estás en la clase.')}catch(error){notify(error.message)}}
async function saveStudentMatricula(event){event.preventDefault();const form=event.currentTarget;try{const result=await api('/profile/student-id',{matricula:form.elements.matricula.value});state.user=result.user;localStorage.setItem('lumina_user',JSON.stringify(state.user));await loadClasses();notify('Matrícula vinculada. Las clases que te asignaron ya aparecerán aquí.')}catch(error){notify(error.message)}}
async function loadAssignments(){if(!state.user)return;state.assignmentsLoading=true;renderPage();try{const results=await Promise.all([api('/assignments'),state.user.profile==='profesor'?api('/classes'):Promise.resolve({classes:state.classes})]);state.assignments=results[0].assignments||[];if(state.user.profile==='profesor')state.classes=results[1].classes||[]}catch(error){notify(error.message)}finally{state.assignmentsLoading=false;renderPage()}}
async function createAssignment(event){event.preventDefault();const form=event.currentTarget,data=Object.fromEntries(new FormData(form));try{data.dueAt=new Date(data.dueAt).toISOString();await api(`/classes/${data.classId}/assignments`,data);await loadAssignments();notify('Tarea publicada para el grupo.')}catch(error){notify(error.message)}}
async function submitAssignment(event,id){event.preventDefault();const form=event.currentTarget;try{await api(`/assignments/${id}/submission`,{body:form.elements.body.value});await loadAssignments();notify('Tu entrega quedó guardada.')}catch(error){notify(error.message)}}
async function gradeAssignment(event,id,studentId){event.preventDefault();const form=event.currentTarget;try{await api(`/assignments/${id}/submissions/${studentId}/grade`,{grade:Number(form.elements.grade.value),feedback:form.elements.feedback.value});await loadAssignments();notify('Calificación y comentarios guardados.')}catch(error){notify(error.message)}}
function assignmentDate(value){const date=new Date(value);return Number.isFinite(date.getTime())?date.toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'}):'Fecha sin definir'}
function studentAssignmentStatus(assignment){if(assignment.grade!=null)return `Calificada · ${assignment.grade}/100`;if(assignment.submittedAt){const late=new Date(assignment.submittedAt)>new Date(assignment.dueAt);return late?'Entregada con retraso':'Entregada · por revisar'}return new Date(assignment.dueAt)<new Date()?'Vencida · sin entregar':'Pendiente'}
function assignmentsPage(){if(state.assignmentsLoading)return `<div class="view-title"><span class="eyebrow">A TU RITMO</span><h1>Tareas</h1><p>Cargando tareas…</p></div>`;if(state.user.profile==='profesor')return `<div class="view-title"><span class="eyebrow">ORGANIZA TU ENSEÑANZA</span><h1>Tareas y entregas</h1><p>Publica actividades para tus grupos y revisa las respuestas de tus alumnos.</p></div>${state.classes.length?`<section class="panel"><h3>Publicar una tarea</h3><form class="class-form assignment-form" onsubmit="createAssignment(event)"><label>Grupo<select name="classId" required>${state.classes.map(c=>`<option value="${c.id}">${esc(c.subject)} · ${esc(c.name)} (${esc(c.academicLevel)})</option>`).join('')}</select></label><label>Título<input name="title" maxlength="120" required placeholder="Ej. Guía de fracciones"></label><label>Instrucciones<textarea name="instructions" maxlength="10000" required placeholder="Explica qué debe realizar el grupo"></textarea></label><label>Fecha y hora límite<input name="dueAt" type="datetime-local" required></label><button class="btn" style="justify-self:start">Publicar tarea</button></form></section>`:'<section class="panel empty">Primero crea un grupo en Mis clases; después podrás asignarle tareas.</section>'}<div class="assignment-grid">${state.assignments.map(a=>`<article class="assignment-card"><div class="assignment-head"><div><span class="eyebrow">${esc(a.subject)} · ${esc(a.className)}</span><h3>${esc(a.title)}</h3></div><span class="assignment-status">${a.submittedCount}/${a.studentCount} entregadas</span></div><div class="assignment-instructions">${esc(a.instructions)}</div><div class="assignment-due">Fecha límite: ${esc(assignmentDate(a.dueAt))}</div><div class="submission-list">${a.submissions.map(s=>`<article class="submission-card"><div class="submission-meta"><div><b>${esc(s.name)}</b><small>${s.matricula?`Matrícula: ${esc(s.matricula)}`:'Cuenta vinculada'} · ${s.submitted?`Entregó: ${esc(assignmentDate(s.submittedAt))}`:'Sin entregar'}</small></div><span class="assignment-status">${s.grade==null?(s.submitted?'Por revisar':'Pendiente'):`${s.grade}/100`}</span></div>${s.submitted?`<div class="submission-body">${esc(s.body)}</div><form class="class-form grade-form" onsubmit="gradeAssignment(event,${a.id},${s.studentId})"><label>Calificación (0–100)<input name="grade" type="number" min="0" max="100" step="1" required value="${s.grade??''}"></label><label>Comentarios para el alumno<textarea name="feedback" maxlength="2000" placeholder="Retroalimentación breve">${esc(s.feedback)}</textarea></label><button class="btn btn-outline btn-small" style="justify-self:start">Guardar revisión</button></form>`:''}</article>`).join('')||'<div class="empty">Todavía no hay alumnos inscritos en este grupo.</div>'}</div></article>`).join('')||'<section class="panel empty">Aún no has publicado tareas.</section>'}</div>`;return `<div class="view-title"><span class="eyebrow">APRENDE A TU RITMO</span><h1>Mis tareas</h1><p>Consulta actividades de tus clases, entrega tus respuestas y revisa los comentarios del docente.</p></div><div class="assignment-grid">${state.assignments.map(a=>`<article class="assignment-card"><div class="assignment-head"><div><span class="eyebrow">${esc(a.subject)} · ${esc(a.className)}</span><h3>${esc(a.title)}</h3><div class="class-meta">Docente: ${esc(a.teacherName)}</div></div><span class="assignment-status">${esc(studentAssignmentStatus(a))}</span></div><div class="assignment-instructions">${esc(a.instructions)}</div><div class="assignment-due">Fecha límite: ${esc(assignmentDate(a.dueAt))}</div><form class="class-form" onsubmit="submitAssignment(event,${a.id})"><label>Tu respuesta<textarea name="body" maxlength="10000" required placeholder="Escribe aquí tu respuesta (máximo 10,000 caracteres)">${esc(a.body)}</textarea></label><button class="btn btn-small">${a.submittedAt?'Actualizar entrega':'Entregar tarea'}</button></form>${a.grade!=null?`<div class="teacher-feedback"><b>Calificación: ${a.grade}/100</b>${a.feedback?`<p>${esc(a.feedback)}</p>`:''}</div>`:a.submittedAt?'<p class="class-meta">Tu entrega está guardada y espera revisión de tu docente.</p>':''}</article>`).join('')||'<section class="panel empty">Aún no tienes tareas. Cuando un docente publique una actividad para una de tus clases, aparecerá aquí.</section>'}</div>`}
function classesPage(){const student=state.user.profile==='alumno';if(state.classesLoading)return `<div class="view-title"><span class="eyebrow">A TU RITMO</span><h1>${student?'Mis clases':'Mis grupos'}</h1><p>Cargando tus clases…</p></div>`;if(student)return `<div class="view-title"><span class="eyebrow">A TU RITMO</span><h1>Mis clases</h1><p>Únete con el código que comparte tu docente.</p></div>${studentMatriculaPanel()}<section class="panel"><form class="class-form" style="grid-template-columns:1fr auto;align-items:end" onsubmit="joinClass(event)"><label>Código de clase<input name="code" minlength="7" maxlength="7" required placeholder="Ej. A4F29C1" style="text-transform:uppercase"></label><button class="btn">Unirme a la clase</button></form></section><div class="class-grid">${state.classes.map(c=>`<article class="class-card"><h3>${esc(c.subject)} · ${esc(c.name)}</h3><div class="class-meta">${esc(c.academicLevel)} · ${esc(c.classType)} · Docente: ${esc(c.teacherName||'Docente')}</div></article>`).join('')||'<section class="panel empty">Aún no tienes clases. Pide un código a tu docente para unirte.</section>'}</div>`;
const levels=['Primaria','Secundaria','Preparatoria','Universidad','Posgrado'];return `<div class="view-title"><span class="eyebrow">ORGANIZA TUS GRUPOS</span><h1>Mis clases</h1><p>Crea grupos, registra matrículas y consulta las preferencias de aprendizaje de tus alumnos.</p></div><section class="panel"><h3>Crear una clase o grupo</h3><form class="class-form" onsubmit="createClass(event)"><div class="form-grid"><label>Nombre del grupo<input name="name" maxlength="100" required placeholder="Ej. Biología · Grupo A"></label><label>Nivel académico<select id="class-level" name="academicLevel" required onchange="setClassSubjectOptions(this.value)"><option value="">Elige nivel</option>${levels.map(level=>`<option>${level}</option>`).join('')}</select></label></div><div class="form-grid"><label>Materia<input id="class-subject" name="subject" list="class-subject-options" maxlength="100" required placeholder="Elige o escribe una materia"><datalist id="class-subject-options">${Object.values(subjectsByLevel).flat().map(subject=>`<option value="${esc(subject)}"></option>`).join('')}</datalist></label><label>Tipo de clase<select name="classType" required><option value="">Elige tipo</option>${['Clase regular','Laboratorio','Seminario','Taller','Práctica','Asesoría','Club o extracurricular'].map(type=>`<option>${type}</option>`).join('')}</select></label></div><button class="btn" style="justify-self:start">Crear grupo y código de acceso</button></form></section><div class="class-grid">${state.classes.map(c=>`<article class="class-card"><h3>${esc(c.subject)} · ${esc(c.name)}</h3><div class="class-meta">${esc(c.academicLevel)} · ${esc(c.classType)}</div><div class="class-code"><span>Código para que se unan</span><strong>${esc(c.classCode)}</strong></div><form class="class-form" onsubmit="addMatriculas(event,${c.id})"><label>Añadir matrículas, una por renglón<textarea name="matriculas" placeholder="Ej. 2026A12345&#10;2026A67890" required></textarea></label><button class="btn btn-outline btn-small" style="justify-self:start">Vincular matrículas</button></form><div class="class-roster"><b style="font-size:11px">Alumnos · ${c.students.length}</b>${c.students.map(studentRosterRow).join('')||'<div class="empty">Agrega matrículas o comparte el código de clase para empezar.</div>'}</div></article>`).join('')||'<section class="panel empty">Aún no has creado grupos. Elige una materia y comparte el código con tus alumnos.</section>'}</div>`}
function noteContextSelector(){const usable=state.notes.filter(note=>note.text?.trim()),selected=state.aiNoteIds.filter(id=>usable.some(note=>Number(note.id)===Number(id))).length;if(!usable.length)return `<div class="chat-notes"><button class="text-link" onclick="go('apuntes')">▤ Guarda un apunte para usarlo como contexto de la IA</button></div>`;return `<details class="chat-notes"><summary>▤ Usar apuntes con la IA · ${selected} seleccionados</summary><div class="chat-note-list">${usable.map(note=>`<label><input type="checkbox" ${state.aiNoteIds.some(id=>Number(id)===Number(note.id))?'checked':''} onchange="toggleAiNote(${Number(note.id)},this.checked)"><span><b>${esc(note.name)}</b><small>${note.visibility==='general'?'Compartido con todos':note.visibility==='class'?'Clase: '+(note.sharedClassNames||[]).map(esc).join(', '):'Personal'}${note.isOwner?' · tu apunte':` · ${esc(note.ownerName||'Comunidad')}`}</small></span></label>`).join('')}<p>La tutora combina lo que dicen estos apuntes con su conocimiento general.</p></div></details>`}
function toggleAiNote(id,checked){const selected=new Set(state.aiNoteIds.map(Number)),wasOpen=Boolean(document.querySelector('.chat-notes')?.open);if(checked)selected.add(Number(id));else selected.delete(Number(id));state.aiNoteIds=[...selected];renderPage();if(wasOpen){const details=document.querySelector('.chat-notes');if(details)details.open=true}}
function suggest(s){$('#prompt').value=s;sendMessage()}
async function sendMessage(){const box=$('#prompt'),text=box?.value.trim();if(!text)return;if(/\b(?:crea|crear|genera|generar|dibuja|dibujar|ilustra|ilustrar|diseña|diseñar|haz|hazme)\b.{0,80}\b(?:imagen(?:es)?|infograf[ií]a|ilustraci[oó]n|dibujo|p[oó]ster)\b/i.test(text)){await generateImage();return;}state.messages.push({role:'user',content:text});box.value='';renderPage();const msgs=$('#messages');msgs.scrollTop=msgs.scrollHeight;const b=$('#sendBtn');if(b){b.disabled=true;b.textContent='…'}state.messages.push({role:'assistant',content:'…'});renderPage();try{const d=await api('/chat',{messages:state.messages.slice(0,-1),subject:state.subject,level:state.level||state.user.details?.level,noteIds:state.aiNoteIds});state.messages[state.messages.length-1].content=d.reply}catch(e){state.messages[state.messages.length-1].content=e.message}renderPage();const end=$('#messages');if(end)end.scrollTop=end.scrollHeight}
function mediaPrompt(type){const box=$('#prompt');box.value=type==='video'?'Escribe un guion para un video educativo sobre ':'Ayúdame a crear contenido sobre ';box.focus();notify(type==='video'?'Lúmina puede preparar el guion del video.':'Escribe el tema y elige una herramienta para crearlo.')}
async function generateImage(){const box=$('#prompt'),prompt=box?.value.trim();if(!prompt){box.value='Crea una imagen educativa sobre ';box.focus();notify('Completa el tema y vuelve a tocar “Crear imagen”.');return}state.messages.push({role:'user',content:`Genera una imagen educativa: ${prompt}`});box.value='';state.messages.push({role:'assistant',content:'Creando tu imagen…'});renderPage();const item=state.messages.at(-1);try{const d=await api('/image',{prompt});item.content='Aquí tienes la imagen generada.';item.image=`data:${d.mimeType};base64,${d.image}`}catch(e){item.content=e.message}renderPage();const end=$('#messages');if(end)end.scrollTop=end.scrollHeight}
function audioPromptNeedsExplanation(text){return /\b(?:expl[ií]c\w*|ens[eé]ñ\w*|dime|cu[eé]ntame|describe|resume|res[uú]me|resuelve|ay[uú]dame a entender|explain\w*|teach\s+me)\b|(?:^|[¿?\s])(?:qu[eé]\s+es|c[oó]mo|por\s+qu[eé]|cu[aá]l(?:es)?|qui[eé]n|d[oó]nde|cu[aá]ndo|what\s+is|how\s+(?:does|do|to)|why)\b|\?\s*$/i.test(text)}
async function generateAudio(){const box=$('#prompt'),typed=box?.value.trim();let item,text=typed;const level=state.level||state.user.details?.level;if(typed&&audioPromptNeedsExplanation(typed)){state.messages.push({role:'user',content:typed});if(box)box.value='';item={role:'assistant',content:'Preparando una explicación para escuchar…'};state.messages.push(item);renderPage();try{const messages=state.messages.slice(0,-1),last=messages.length-1;messages[last]={...messages[last],content:`${typed}\n\nRespóndeme con una explicación clara y natural para escuchar, sin tablas ni código, y de máximo 3000 caracteres.`};const answer=await api('/chat',{messages,subject:state.subject,level,noteIds:state.aiNoteIds});item.content=answer.reply;text=answer.reply}catch(e){item.content=e.message;renderPage();return}}else if(typed){state.messages.push({role:'user',content:'Convierte este texto en audio.'});if(box)box.value='';item={role:'assistant',content:typed};state.messages.push(item);renderPage()}else{item=[...state.messages].reverse().find(m=>m.role==='assistant'&&typeof m.content==='string'&&m.content.trim()&&!['…','Preparando el audio…','Preparando una explicación para escuchar…','Audio generado. Puedes reproducirlo aquí.'].includes(m.content));if(!item){notify('Primero pide una explicación o escribe el texto que quieres escuchar.');box?.focus();return}text=item.content;notify('Preparando el audio de la última respuesta…')}if(!text){notify('No encontré texto para convertir en audio.');return}try{const d=await api('/audio',{text});item.audio=`data:${d.mimeType};base64,${d.audio}`}catch(e){state.messages.push({role:'assistant',content:`No pude generar el audio: ${e.message}`})}renderPage();const end=$('#messages');if(end)end.scrollTop=end.scrollHeight}
function makeDiagram(){const q=prompt('¿Qué concepto te gustaría representar en un mapa de ideas?');if(!q)return;state.messages.push({role:'user',content:`Crea un diagrama Mermaid flowchart TD sobre: ${q}. Responde primero con el código Mermaid dentro de un bloque de código y luego una breve explicación.`});state.page='chat';shell();setTimeout(()=>sendDirect(),30)}
async function sendDirect(){state.messages.push({role:'assistant',content:'…'});renderPage();try{const d=await api('/chat',{messages:state.messages.slice(0,-1),subject:state.subject,level:state.level,noteIds:state.aiNoteIds});state.messages.at(-1).content=d.reply}catch(e){state.messages.at(-1).content=e.message}renderPage()}
async function extractPdfText(file){const version='4.10.38',base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+version+'/';const pdfjs=await import(base+'pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.mjs';const task=pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false});const pdf=await task.promise;let text='';try{for(let pageNumber=1;pageNumber<=Math.min(pdf.numPages,100)&&text.length<25000;pageNumber++){const page=await pdf.getPage(pageNumber),content=await page.getTextContent();text+=content.items.map(item=>item.str||'').join(' ')+'\n';}return {text:text.trim().slice(0,25000),pages:pdf.numPages}}finally{await pdf.destroy()}}
async function readFile(input){const f=input.files?.[0];if(!f)return;const draft={name:f.name,size:(f.size/1024).toFixed(0)+' KB',date:new Date().toLocaleDateString('es-MX'),text:'',visibility:'private'};const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);if(isPdf){if(f.size>10*1024*1024){notify('El PDF supera el límite de 10 MB.');input.value='';return}try{const result=await extractPdfText(f);draft.text=result.text;if(!draft.text)notify('No encontré texto seleccionable. Si el PDF es un escaneo, pega aquí el texto para poder estudiarlo.');else if(result.pages>100)notify('Leí las primeras 100 páginas del PDF. Puedes revisar el texto antes de guardarlo.')}catch(error){notify('No pude leer este PDF. Si tiene contraseña o es un escaneo, pega su texto en el apunte.')}openManualNote(null,draft);input.value='';return}if(f.size<=300000&&(f.type.startsWith('text/')||/\.(txt|md|csv|json|html|js|py)$/i.test(f.name)))draft.text=(await f.text()).slice(0,25000);if(!draft.text)notify('Este formato no se puede leer automáticamente. Puedes pegar el contenido en el formulario.');openManualNote(null,draft);input.value=''}
async function removeNote(index){const note=state.notes[index];if(!note||!note.isOwner)return;try{await apiRequest('/notes/'+note.id,{method:'DELETE'});state.notes.splice(index,1);state.aiNoteIds=state.aiNoteIds.filter(id=>Number(id)!==Number(note.id));renderPage();notify('Apunte eliminado.')}catch(error){notify(error.message)}}

const quiz=[{q:'Un problema tiene 3 cajas con 4 lápices cada una. ¿Cuántos lápices hay?',a:['7','12','34','1'],correct:1,why:'Tres grupos de cuatro son 3 × 4 = 12.'},{q:'¿Qué necesita una planta principalmente para producir su alimento?',a:['Luz del sol','Arena','Viento fuerte','Piedras'],correct:0,why:'Las plantas usan la luz solar en la fotosíntesis.'},{q:'Si el agua se congela, ¿qué cambio ocurre?',a:['De líquido a sólido','De sólido a gas','De líquido a gas','No cambia'],correct:0,why:'Al enfriarse, el agua líquida cambia a estado sólido.'},{q:'¿Cuál es la idea principal de un texto?',a:['El título más largo','Lo que el texto comunica principalmente','Una palabra desconocida','La última oración'],correct:1,why:'La idea principal resume lo que el texto comunica en conjunto.'},{q:'Un libro cuesta 80 pesos y tiene 25% de descuento. ¿Cuánto se descuenta?',a:['10 pesos','15 pesos','20 pesos','25 pesos'],correct:2,why:'El 25% es una cuarta parte: 80 ÷ 4 = 20 pesos.'}];
const learningQuestions=[{q:'Cuando empiezas un tema nuevo, ¿qué te ayuda más?',a:[['Ver un esquema, dibujo o demostración','visual'],['Escuchar una explicación o conversar','auditivo'],['Leer una explicación y tomar notas','lectura'],['Probarlo con una actividad práctica','kinestesico']]},{q:'Para recordar una idea importante, sueles preferir…',a:[['Asociarla con una imagen o mapa','visual'],['Repetirla en voz alta o explicarla','auditivo'],['Escribirla con tus propias palabras','lectura'],['Practicarla o representarla','kinestesico']]},{q:'En una clase, te resulta más cómodo…',a:[['Seguir gráficos y ejemplos en pantalla','visual'],['Escuchar y participar en una conversación','auditivo'],['Leer instrucciones y apuntes','lectura'],['Hacer una actividad o experimento','kinestesico']]},{q:'Cuando estudias una palabra nueva, prefieres…',a:[['Ver una imagen que la represente','visual'],['Escuchar cómo se pronuncia y usarla','auditivo'],['Leerla y escribirla varias veces','lectura'],['Usarla en una actividad o juego','kinestesico']]},{q:'Para aprender a resolver un problema, eliges…',a:[['Observar un diagrama con los pasos','visual'],['Escuchar a alguien explicar el razonamiento','auditivo'],['Leer un procedimiento paso a paso','lectura'],['Resolver ejercicios mientras practicas','kinestesico']]},{q:'¿Qué recurso te gustaría tener para repasar?',a:[['Una infografía o mapa visual','visual'],['Una explicación grabada o conversación','auditivo'],['Una guía escrita y tarjetas','lectura'],['Un juego, modelo o práctica','kinestesico']]},{q:'Al explicar algo que aprendiste, normalmente…',a:[['Dibujas o señalas una imagen','visual'],['Lo cuentas y lo conversas','auditivo'],['Escribes un resumen ordenado','lectura'],['Lo muestras haciendo una demostración','kinestesico']]},{q:'Si te distraes al estudiar, ¿qué actividad te ayuda a retomar?',a:[['Ordenar el tema con colores o dibujos','visual'],['Decir las ideas en voz alta','auditivo'],['Hacer una lista o releer apuntes','lectura' function startLearningQuiz(){if(state.user?.profile!=='alumno'){notify('El test de aprendizaje es solo para estudiantes.');return}state.learningIndex=0;state.learningChoice=null;state.learningAnswers=[];learningQuizModal()}
function learningQuizModal(){if(state.user?.profile!=='alumno')return;const i=state.learningIndex,q=learningQuestions[i];if(!q){finishLearningQuiz();return}modal(`<div class="modal-top"><h2>Cómo prefieres aprender 🌱</h2><button class="close" onclick="closeModal()">×</button></div><p>Elige la opción que más se parece a ti. No hay respuestas correctas o incorrectas; es solo una orientación.</p><div class="quiz-progress"><i style="width:${i/learningQuestions.length*100}%"></i></div><div class="quiz-question">${i+1}. ${q.q}</div><div class="answers">${q.a.map(([label,type])=>`<button onclick="chooseLearningStyle('${type}')" style="${state.learningChoice===type?'border-color:#80967c;background:#eff3eb':''}">${label}</button>`).join('')}</div><div class="quiz-footer"><span>${i+1} de ${learningQuestions.length}</span><button class="btn btn-small" onclick="nextLearningQuestion()">${i===learningQuestions.length-1?'Ver resultado':'Siguiente →'}</button></div>`)}
function chooseLearningStyle(type){state.learningChoice=type;learningQuizModal()}
function nextLearningQuestion(){if(!state.learningChoice){notify('Elige la opción que más se parece a ti.');return}state.learningAnswers.push(state.learningChoice);state.learningIndex++;state.learningChoice=null;learningQuizModal()}
function finishLearningQuiz(){const labels={visual:'Visual',auditivo:'Auditivo',lectura:'Lectura y escritura',kinestesico:'Práctico y kinestésico'},scores={visual:0,auditivo:0,lectura:0,kinestesico:0};state.learningAnswers.forEach(type=>{if(Object.hasOwn(scores,type))scores[type]++});const max=Math.max(...Object.values(scores)),preferences=Object.keys(scores).filter(type=>scores[type]===max).map(type=>labels[type]);state.user.details={...(state.user.details||{}),learningStyle:{preferences,scores,completedAt:new Date().toISOString()}};localStorage.setItem('lumina_user',JSON.stringify(state.user));api('/profile',{details:state.user.details}).catch(()=>{});modal(`<div class="modal-top"><h2>Tu perfil de aprendizaje 🌿</h2><button class="close" onclick="closeModal()">×</button></div><p>Según tus respuestas, tus preferencias más frecuentes son:</p><div style="padding:15px;text-align:center"><div style="font:700 24px Manrope;color:#577158">${preferences.map(esc).join(' · ')}</div><p>Es una orientación, no una etiqueta. Combinar imágenes, conversación, lectura y práctica puede ayudarte a aprender.</p></div><button class="btn" style="width:100%" onclick="closeModal();render()">Continuar a mi espacio</button>`)}
function startQuiz(){if(state.user?.profile!=='alumno'){notify('El diagnóstico es solo para estudiantes.');return}state.quizIndex=0;state.quizScore=0;state.quizChoice=null;quizModal()}
function quizModal(){if(state.user?.profile!=='alumno')return;const i=state.quizIndex;if(i>=quiz.length){const pct=Math.round(state.quizScore/quiz.length*100);state.user.details={...(state.user.details||{}),quizScore:pct,level:state.user.details?.level||state.level};localStorage.setItem('lumina_user',JSON.stringify(state.user));api('/profile',{details:state.user.details}).catch(()=>{});modal(`<div class="modal-top"><h2>Tu diagnóstico inicial 🌱</h2><button class="close" onclick="closeModal()">×</button></div><p>Gracias por pensar cada respuesta. Esto es una orientación, no una calificación.</p><div style="padding:25px;text-align:center"><div style="font:700 42px Manrope;color:#577158">${pct}%</div><p>${pct>=80?'¡Qué buena base! Puedes explorar temas nuevos con confianza.':pct>=60?'Tienes un buen comienzo. La práctica te ayudará a afianzar ideas.':'Este es solo un punto de partida. Cada pregunta nueva es una oportunidad.'}</p></div><button class="btn" style="width:100%" onclick="closeModal();render()">Continuar a mi espacio</button></div>`);return}const q=quiz[i];modal(`<div class="modal-top"><h2>Tu primer diagnóstico</h2><button class="close" onclick="closeModal()">×</button></div><p>Una oportunidad para conocerte como aprendiz. Puedes tomarte tu tiempo.</p><div class="quiz-progress"><i style="width:${i/quiz.length*100}%"></i></div><div class="quiz-question">${i+1}. ${q.q}</div><div class="answers">${q.a.map((a,j)=>`<button onclick="answerQuiz(${j})" style="${state.quizChoice===j?'border-color:#80967c;background:#eff3eb':''}">${a}</button>`).join('')}</div><div class="quiz-footer"><span>${i+1} de ${quiz.length}</span><button class="btn btn-small" onclick="nextQuiz()">${i===quiz.length-1?'Ver resultado':'Siguiente →'}</button></div>`)}
function answerQuiz(j){state.quizChoice=j;if(j===quiz[state.quizIndex].correct)state.quizScore++;quizModal()}
function nextQuiz(){if(state.quizChoice===null){notify('Elige una respuesta para continuar.');return}state.quizIndex++;state.quizChoice=null;quizModal()}
function modal(html){document.querySelector('.overlay')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`)}function closeModal(){document.querySelector('.overlay')?.remove()}
function openLogin(){modal(`<div class="modal-top"><h2>Hola de nuevo 👋</h2><button class="close" onclick="closeModal()">×</button></div><p>Nos da gusto que hayas vuelto.</p><form class="form" onsubmit="login(event)"><label>Correo electrónico<input name="email" type="email" required placeholder="tu@correo.com"></label><label>Contraseña<input name="password" type="password" required minlength="8" placeholder="Al menos 8 caracteres"></label><button class="btn">Iniciar sesión</button><button type="button" class="text-link" onclick="openRegister()">¿Primera vez? Crea tu cuenta</button></form>`)}
function calculateRegistrationAge(value){if(!value)return null;const [year,month,day]=value.split('-').map(Number),birth=new Date(year,month-1,day),today=new Date();if(birth.getFullYear()!==year||birth.getMonth()!==month-1||birth.getDate()!==day||birth>new Date(today.getFullYear(),today.getMonth(),today.getDate()))return null;let age=today.getFullYear()-year;if(today.getMonth()+1<month||(today.getMonth()+1===month&&today.getDate()<day))age--;return age>=0?age:null}
function updateRegistrationAge(){const form=$('#regform');if(!form)return;const birth=form.elements.birth,age=calculateRegistrationAge(birth.value);form.elements.age.value=age===null?'':age;form.elements.age.classList.toggle('derived-invalid',age===null||age<5||age>120);birth.setCustomValidity(age!==null&&(age<5||age>120)?'El registro está disponible para personas de 5 a 120 años.':'')}
function openRegister(){const today=new Date(),maxDate=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;modal(`<div class="modal-top"><h2>Tu camino empieza aquí ✳</h2><button class="close" onclick="closeModal()">×</button></div><p>Crea tu espacio de aprendizaje personalizado.</p><p style="font-size:11px;color:#777">Los campos con <span class="required-star">*</span> son obligatorios.</p><form class="form" id="regform" onsubmit="register(event)"><div class="tabs"><button class="on" type="button" id="tab-alumno" onclick="setProfile('alumno')">Soy estudiante</button><button type="button" id="tab-profesor" onclick="setProfile('profesor')">Soy docente</button></div><input type="hidden" name="profile" value="alumno"><label><span>Nombre completo <i class="required-star">*</i></span><input name="name" required oninvalid="this.form.classList.add('was-validated')" placeholder="Como te gusta que te llamen"></label><label><span>Correo electrónico <i class="required-star">*</i></span><input name="email" type="email" required oninvalid="this.form.classList.add('was-validated')" placeholder="tu@correo.com"></label><label><span>Contraseña <i class="required-star">*</i></span><input name="password" type="password" minlength="8" required oninvalid="this.form.classList.add('was-validated')" placeholder="Al menos 8 caracteres"></label><div class="form-grid"><label><span>Fecha de nacimiento <i class="required-star">*</i></span><input name="birth" type="date" required max="${maxDate}" oninput="updateRegistrationAge()" onchange="updateRegistrationAge()" oninvalid="this.form.classList.add('was-validated')"></label><label><span>Edad <i class="required-star">*</i></span><input name="age" type="number" class="derived-invalid" min="5" max="120" readonly placeholder="Se calcula automáticamente" aria-describedby="age-help"><small id="age-help" style="font-size:10px;color:#81857d;font-weight:400">Se calcula con tu fecha de nacimiento.</small></label></div><div id="student-fields"><div class="form-grid"><label><span>Nivel académico <i class="required-star">*</i></span><select name="level" required onchange="setStudentLevel(this.value)" oninvalid="this.form.classList.add('was-validated')"><option value="">Elige nivel</option>${['Primaria','Secundaria','Preparatoria','Universidad','Posgrado'].map(x=>`<option>${x}</option>`).join('')}</select></label><label><span>Matrícula universitaria <i id="student-id-required" class="required-star hidden">*</i></span><input name="studentId" placeholder="Obligatoria para universidad" oninvalid="this.form.classList.add('was-validated')"></label></div></div><div id="teacher-fields" class="hidden"><label><span>Niveles en los que enseñas <i class="required-star">*</i></span><input name="teachLevels" placeholder="Secundaria, preparatoria..." oninvalid="this.form.classList.add('was-validated')"></label><label>Materias que impartes<input name="subjects" placeholder="Biología, historia..."></label><label>Matrícula docente<input name="teacherId" placeholder="Opcional"></label></div><button class="btn">Crear mi cuenta</button><button type="button" class="text-link" onclick="openLogin()">Ya tengo una cuenta</button></form>`)}
function setProfile(p){const f=$('#regform');f.profile.value=p;$('#tab-alumno').classList.toggle('on',p==='alumno');$('#tab-profesor').classList.toggle('on',p==='profesor');$('#student-fields').classList.toggle('hidden',p!=='alumno');$('#teacher-fields').classList.toggle('hidden',p!=='profesor');f.level.required=p==='alumno';f.teachLevels.required=p==='profesor';setStudentLevel(p==='alumno'?f.level.value:'');f.level.oninvalid=function(){this.form.classList.add('was-validated')};f.teachLevels.oninvalid=function(){this.form.classList.add('was-validated')}}
async function register(e){e.preventDefault();const f=new FormData(e.currentTarget),profile=f.get('profile'),teachLevels=f.get('teachLevels'),details={birth:f.get('birth'),age:Number(f.get('age')),level:profile==='alumno'?f.get('level'):teachLevels,teachLevels:profile==='profesor'?teachLevels:'',studentId:f.get('studentId'),teacherId:f.get('teacherId'),subjects:f.get('subjects')};try{const d=await api('/register',{name:f.get('name'),email:f.get('email'),password:f.get('password'),profile,details});closeModal();saveUser(d);notify('Tu espacio ya está listo. ¡Bienvenida/o!');if(profile==='alumno')setTimeout(startLearningQuiz,500)}catch(e){notify(e.message)}}
async function login(e){e.preventDefault();const f=new FormData(e.currentTarget);try{const d=await api('/login',{email:f.get('email'),password:f.get('password')});closeModal();saveUser(d);notify('¡Qué gusto verte de nuevo!')}catch(e){notify(e.message)}}
function logout(){if(state.token)api('/logout',{}).catch(()=>{});state.token='';state.user=null;state.messages=[];state.notes=[];state.aiNoteIds=[];state.notesLoadedUserId=null;state.classes=[];state.assignments=[];state.assignmentsLoading=false;localStorage.removeItem('lumina_token');localStorage.removeItem('lumina_user');render()}
function readProfileTheme(){const t=localStorage.getItem('lumina_theme');if(t)$('.theme-select')&&($('.theme-select').value=t,setTheme(t))}
if(state.user&&state.token){fetch('/api/me',{headers:{authorization:'Bearer '+state.token}}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{state.user={...state.user,...d.user};render();loadNotes()}).catch(()=>{logout()})}else render();setTimeout(readProfileTheme,30);
</script></body></html>
