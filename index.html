function notify(s){const n=document.createElement('div');n.className='flash';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),3100)}
function saveUser(d){state.token=d.token;state.user=d.user;localStorage.setItem('lumina_token',d.token);localStorage.setItem('lumina_user',JSON.stringify(d.user));render()}
function brand(){return `<div class="brand"><span class="brandmark">✳</span> aula lúmina</div>`}
function render(){if(!state.user){landing();return} shell()}
function landing(){app.innerHTML=`<main class="public"><header class="public-nav">${brand()}<div class="public-actions"><button class="btn btn-outline install-btn" onclick="installApp()">Instalar</button><button class="btn btn-outline" onclick="openLogin()">Iniciar sesión</button><button class="btn" onclick="openRegister()">Crear cuenta</button></div></header><section class="public-hero"><div class="public-copy"><span class="eyebrow">✳ &nbsp;Tu espacio para aprender</span><h1>Entiende más.<br><em>Llega más lejos.</em></h1><p>Una compañía para tu camino académico. Haz preguntas, explora ideas y aprende a tu ritmo, en cualquier etapa.</p><div class="public-cta"><button class="btn" onclick="openRegister()">Empieza a aprender &nbsp;→</button><button class="btn btn-outline" onclick="openLogin()">Ya tengo cuenta</button></div><p class="public-note">✧ Para estudiantes y docentes · de primaria a universidad</p><div class="features"><span>Aprendizaje personalizado</span><span>Un lugar para tus apuntes</span><span>En español</span></div></div><div class="visual-card"><div class="float-card f1">✦ <b>Una duda menos</b><span>Y una idea más clara</span></div><div class="book-stack">📚</div><div class="float-card f2">◉ <b>A tu propio ritmo</b><span>Tu aprendizaje, a tu manera</span></div></div></section></main>`}
function shell(){const name=state.user.name.split(' ')[0],student=state.user.profile==='alumno',style=state.user.details?.learningStyle;app.innerHTML=`<aside class="sidebar">${brand()}<div class="group-label">Tu espacio</div><nav class="nav">${[['inicio','⌂','Inicio'],['clases','▦','Mis clases'],['chat','✧','Tutor IA'],['apuntes','▤','Mis apuntes'],['progreso','◷','Mi progreso']].map(([id,ic,t])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')"><span class="ico">${ic}</span>${t}</button>`).join('')}</nav><div class="sidebar-bottom">${student?`<div class="upgrade"><b>${style?'Sigue aprendiendo 🌱':'Conoce cómo aprendes 🌱'}</b><p>${style?'Explora nuevas ideas a tu ritmo.':'Descubre qué formas de estudio te resultan más cómodas.'}</p><button class="btn btn-outline btn-small" onclick="${style?'startQuiz()':'startLearningQuiz()'}">${style?'Repasar conceptos':'Test de aprendizaje'}</button></div>`:`<div class="upgrade"><b>Un espacio para enseñar 🌿</b><p>Prepara explicaciones y recursos para tus clases.</p><button class="btn btn-outline btn-small" onclick="go('clases')">Ver mis grupos</button></div>`}<div class="avatar-row"><div class="avatar">${esc(name[0]?.toUpperCase())}</div><div class="user-text"><b>${esc(name)}</b><small>${student?'Estudiante':'Docente'} · ${esc(state.user.details?.level||'Tu espacio')}</small></div></div></div></aside><main class="main"><header class="topbar"><span class="crumb">Espacio de aprendizaje &nbsp; / &nbsp; <b>${pageName()}</b></span><div class="topright"><select class="theme-select" onchange="setTheme(this.value)"><option value="green">◉ Olivo</option><option value="lilac">◉ Lavanda</option><option value="blue">◉ Cielo</option><option value="rose">◉ Rosa</option></select><button class="btn btn-outline btn-small install-btn" onclick="installApp()">Instalar app</button><button class="round" title="Cerrar sesión" onclick="logout()">↗</button></div></header><div id="view"></div></main>`;renderPage()}
function pageName(){return {inicio:'Inicio',clases:'Mis clases',chat:'Tutor IA',apuntes:'Mis apuntes',progreso:state.user?.profile==='profesor'?'Mi espacio docente':'Mi progreso'}[state.page]}
function go(p){state.page=p;shell();if(p==='clases')loadClasses()}
function setTheme(t){const c={green:['#f7f5f0','#4d654e','#e8ede2'],lilac:['#f6f3f8','#78658e','#eeeaf5'],blue:['#f2f6f8','#507589','#e3edf1'],rose:['#faf3f1','#936c64','#f4e7e2']}[t];document.documentElement.style.setProperty('--paper',c[0]);document.documentElement.style.setProperty('--green',c[1]);document.documentElement.style.setProperty('--soft',c[2]);localStorage.setItem('lumina_theme',t)}
function renderPage(){const v=$('#view');if(!v)return;if(state.page==='inicio')v.innerHTML=home();else if(state.page==='clases')v.innerHTML=classesPage();else if(state.page==='chat')v.innerHTML=chat();else if(state.page==='apuntes')v.innerHTML=notesPage();else v.innerHTML=progressPage()}
function home(){const student=state.user.profile==='alumno',details=state.user.details||{},style=details.learningStyle;const stats=student?`<div class="stat"><div class="stat-label">Preferencia de aprendizaje</div><div class="stat-value" style="font-size:16px">${esc(style?.preferences?.join(' · ')||'Por descubrir')}<small>${style?'orientativa':'test inicial'}</small></div></div><div class="stat"><div class="stat-label">Apuntes guardados</div><div class="stat-value">${state.notes.length}<small>documentos</small></div></div><div class="stat"><div class="stat-label">Diagnóstico académico</div><div class="stat-value">${details.quizScore!=null?details.quizScore+'%':'—'} <small>${details.quizScore!=null?'resultado':'opcional'}</small></div></div>`:`<div class="stat"><div class="stat-label">Apuntes reunidos</div><div class="stat-value">${state.notes.length}<small>documentos</small></div></div><div class="stat"><div class="stat-label">Nivel académico</div><div class="stat-value" style="font-size:16px">${esc(details.level||'Por elegir')}</div></div><div class="stat"><div class="stat-label">Materias que impartes</div><div class="stat-value" style="font-size:14px">${esc(details.subjects||'Por agregar')}</div></div>`;const nextTitle=student?'Tu próximo paso':'Tu espacio docente';const nextText=student?(!style?'Responde unas preguntas breves para conocer tus preferencias de estudio. El resultado es orientativo, no una etiqueta.':details.quizScore==null?'Tu perfil de aprendizaje está listo. Si quieres, completa también el diagnóstico académico o empieza a estudiar.':'Sigue aprendiendo a tu ritmo. Guarda tus apuntes o conversa con tu tutora sobre cualquier tema.'):'Conversa con Lúmina para preparar explicaciones, ejemplos y recursos para tus clases.';const nextAction=student?(!style?'startLearningQuiz()':details.quizScore==null?'startQuiz()':"go('apuntes')"):"go('chat')";const nextLabel=student?(!style?'Conocer cómo aprendo →':details.quizScore==null?'Diagnóstico opcional →':'Explorar mis apuntes →'):'Preparar una clase →';return `<section class="welcome"><span class="eyebrow">${new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</span><h1>Qué gusto verte, ${esc(state.user.name.split(' ')[0])} <span style="font-size:22px">☀️</span></h1><p>Un buen momento para descubrir algo nuevo.</p></section><section class="hero"><div class="hero-copy"><div class="hero-kicker">✦ &nbsp; TU COMPAÑERA DE ESTUDIO</div><h2>La curiosidad es el comienzo de todo.</h2><p>¿Qué te gustaría entender hoy?</p><button class="btn" onclick="go('chat')">Conversar con Lúmina &nbsp;→</button></div><div class="hero-art">🌱</div></section><div class="section-head"><h3>Tu espacio de hoy</h3><button class="text-link" onclick="go('progreso')">Ver mi avance &nbsp;→</button></div><div class="grid-stats">${stats}</div><div class="content-grid"><section class="panel"><div class="panel-head"><h3>Explora una materia</h3><button class="text-link" onclick="go('chat')">Preguntar →</button></div><div class="subject-list">${[['∑','Matemáticas','Descubre el porqué, paso a paso','74%'],['◈','Ciencias','Explora cómo funciona el mundo','52%'],['▱','Lengua y literatura','Lee, escribe, expresa tus ideas','38%']].map(a=>`<div class="subject-row"><div class="subject-icon">${a[0]}</div><div class="subject-meta"><b>${a[1]}</b><small>${a[2]}</small></div><div class="progress"><i style="width:${a[3]}"></i></div></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><h3>${nextTitle}</h3><span style="font-size:18px">🌿</span></div><p style="font-size:12px;line-height:1.75;color:var(--muted)">${nextText}</p><button class="btn btn-outline btn-small" onclick="${nextAction}">${nextLabel}</button></section></div>`}
function chat(){return `<div class="study-layout"><section class="panel chat-panel"><div class="chat-head"><div class="chat-title"><div class="bot-avatar">✧</div><div><b>Lúmina</b><small>Tu compañera de aprendizaje</small></div></div><span class="online">● lista para conversar</span></div><div class="chat-context"><select onchange="state.level=this.value"><option value="">Elige tu nivel</option>${['Primaria','Secundaria','Preparatoria','Universidad','Posgrado','Docente'].map(x=>`<option ${state.level===x?'selected':''}>${x}</option>`).join('')}</select><select onchange="state.subject=this.value"><option value="">Materia · opcional</option>${[...new Set([...(subjectsByLevel[state.level||state.user.details?.level]||Object.values(subjectsByLevel).flat()),'Otra materia'])].map(x=>`<option ${state.subject===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="messages" id="messages">${state.messages.length?state.messages.map(m=>`<div class="msg ${m.role}"><span class="msg-name">${m.role==='user'?'Tú':'Lúmina'}</span>${esc(m.content)}${m.image?`<img src="${esc(m.image)}" alt="Imagen educativa generada" style="display:block;max-width:100%;border-radius:10px;margin-top:9px">`:''}${m.audio?`<audio controls preload="none" src="${esc(m.audio)}" style="display:block;width:min(100%,340px);margin-top:9px"></audio>`:''}</div>`).join(''):`<div class="msg assistant"><span class="msg-name">Lúmina</span>¡Hola, ${esc(state.user.name.split(' ')[0])}! 🌿 ¿Qué te gustaría aprender hoy? Puedes preguntarme cualquier cosa, incluso si aún no tienes apuntes.</div>`}</div><div class="suggestions"><button onclick="suggest('Explícame este tema paso a paso')">Explícamelo paso a paso</button><button onclick="suggest('Ayúdame a repasar con preguntas')">Quiero repasar</button><button onclick="suggest('Dame un ejemplo práctico')">Con un ejemplo</button></div><div class="composer"><textarea id="prompt" placeholder="Escribe cualquier pregunta para comenzar…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea><div class="compose-bottom"><div class="tool-buttons"><button onclick="document.querySelector('#fileUp').click()">＋ Apunte</button><button onclick="makeDiagram()">◇ Diagrama</button><button onclick="generateImage()">▧ Crear imagen</button><button onclick="generateAudio()">♫ Crear audio</button><button onclick="mediaPrompt('video')">▷ Guion de video</button><input type="file" id="fileUp" class="hidden" accept=".txt,.md,.csv,.pdf,.doc,.docx,.png,.jpg" onchange="readFile(this)"></div><button class="btn btn-small" id="sendBtn" onclick="sendMessage()">Enviar &nbsp;↑</button></div></div></section><aside class="side-tools"><section class="tool-card"><div class="tool-title"><span class="tool-emoji">✎</span><b>Una pregunta, muchas maneras</b></div><p>Conversa, pide ejemplos y explora cualquier materia a tu propio ritmo.</p><button class="btn btn-outline btn-small" onclick="$('#prompt').focus()">Escribir una pregunta</button></section><section class="tool-card"><div class="tool-title"><span class="tool-emoji" style="background:#eaf0e7">◇</span><b>Mapas de ideas</b></div><p>Convierte un tema en un diagrama Mermaid editable.</p><button class="btn btn-outline btn-small" onclick="makeDiagram()">Crear un diagrama</button></section><section class="panel"><div class="panel-head"><h3>Apuntes recientes</h3><button class="text-link" onclick="go('apuntes')">Ver todos</button></div>${state.notes.slice(-3).reverse().map(n=>`<div class="library-item"><div><b>${esc(n.name)}</b><small>${esc(n.size)} · Guardado en este navegador</small></div><span>▤</span></div>`).join('')||'<div class="empty">Tus apuntes aparecerán aquí.</div>'}</section></aside></div>`}
function notesPage(){return `<div class="view-title"><span class="eyebrow">TU BIBLIOTECA</span><h1>Mis apuntes</h1><p>Convierte tu material en una guía para aprender a tu ritmo.</p></div><section class="panel"><div class="panel-head"><h3>Tu biblioteca personal</h3><div class="note-actions"><button class="btn btn-outline btn-small" onclick="openManualNote()">＋ Pegar texto</button><button class="btn btn-small" onclick="go('chat');setTimeout(()=>$('#fileUp')?.click(),100)">＋ Añadir archivo</button></div></div><p style="color:var(--muted);font-size:11px;line-height:1.7">Elige “Estudiar con IA” para crear un resumen, tarjetas de estudio y un cuestionario con respuestas explicadas. Para archivos que no sean de texto, pega el contenido aquí.</p>${state.notes.map((n,i)=>`<div class="library-item note-row"><div class="note-copy"><b>▤ &nbsp; ${esc(n.name)}</b><small>${esc(n.size)} · ${esc(n.date)} · ${n.text?'Listo para estudiar':'Pega el texto para crear una guía'}</small></div><div class="note-actions">${n.text?`<button class="btn btn-outline btn-small" onclick="openStudyGuide(${i})">✦ Estudiar con IA</button>`:`<button onclick="openManualNote(${i})">Pegar texto</button>`}<button onclick="removeNote(${i})">Quitar</button></div></div>`).join('')||'<div class="empty">Aún no tienes apuntes. Pega texto o añade un archivo para crear tu primera guía.</div>'}</section><section class="panel" style="margin-top:15px"><h3>Materias</h3><p style="color:var(--muted);font-size:11px;margin:8px 0 13px">Pregúntale a Lúmina sobre cualquier tema, con o sin apuntes.</p><button class="btn btn-outline btn-small" onclick="go('chat')">Abrir tutora IA →</button></section>`}
function openManualNote(index=null){const existing=Number.isInteger(index)?state.notes[index]:null;modal(`<div class="modal-top"><h2>${existing?'Añadir texto al apunte':'Agregar apuntes'}</h2><button class="close" onclick="closeModal()">×</button></div><p>Pega tus notas o el texto de un documento. Lúmina lo usará para crear tu guía de estudio.</p><form class="form" onsubmit="saveManualNote(event)"><input type="hidden" name="noteIndex" value="${existing?index:''}"><label>Nombre del apunte<input name="name" required maxlength="100" placeholder="Ej. Fotosíntesis · Ciencias" value="${esc(existing?.name||'')}"></label><label>Texto<textarea name="text" required minlength="20" maxlength="25000" rows="8" placeholder="Pega aquí tus apuntes…">${esc(existing?.text||'')}</textarea></label><button class="btn">Guardar apunte</button></form>`)}
function saveManualNote(event){event.preventDefault();const form=event.currentTarget,name=form.elements.name.value.trim(),text=form.elements.text.value.trim(),index=form.elements.noteIndex.value===''?-1:Number(form.elements.noteIndex.value);if(text.length<20){notify('Pega al menos 20 caracteres para guardar el apunte.');return}const note={...(state.notes[index]||{}),name,size:(new Blob([text]).size/1024).toFixed(0)+' KB',date:new Date().toLocaleDateString('es-MX'),text};delete note.studyGuide;if(index>=0&&state.notes[index])state.notes[index]=note;else state.notes.push(note);localStorage.setItem('lumina_notes',JSON.stringify(state.notes));closeModal();renderPage();notify('Apunte guardado. Ya puedes crear tu guía de estudio.')}
function openStudyGuide(index){const note=state.notes[index];if(!note)return;if(!note.text){modal(`<div class="modal-top"><h2>Falta el texto del apunte</h2><button class="close" onclick="closeModal()">×</button></div><p>Este archivo se guardó en tu biblioteca, pero el navegador no pudo leer su contenido. Pega el texto del documento para que Lúmina pueda estudiarlo.</p><button class="btn" onclick="closeModal();openManualNote(${index})">Pegar texto</button>`);return}const requestId=++guideRequestId;activeGuide={name:note.name,index,content:note.text.slice(0,12000),guide:note.studyGuide||null};guideTab='summary';guideLoading=!activeGuide.guide;guideError='';flippedCards=new Set();quizSelections={};modal(studyModalHtml());document.querySelector('.overlay .modal').dataset.study='yes';if(activeGuide.guide)return;api('/study-guide',{content:activeGuide.content,sourceName:note.name,subject:state.subject,level:state.user.details?.level||state.level}).then(d=>{if(requestId!==guideRequestId)return;activeGuide.guide=d.guide;state.notes[index].studyGuide=d.guide;localStorage.setItem('lumina_notes',JSON.stringify(state.notes));guideLoading=false;renderStudyModal()}).catch(e=>{if(requestId!==guideRequestId)return;guideError=e.message;guideLoading=false;renderStudyModal()})}
function studyModalHtml(){const modalTop=`<div class="modal-top"><div><span class="eyebrow">GUÍA DE ESTUDIO</span><h2>${esc(activeGuide?.name||'Mis apuntes')}</h2></div><button class="close" onclick="closeModal()">×</button></div>`;if(guideLoading)return `${modalTop}<div class="study-loading"><div class="study-spinner"></div><b>Lúmina está preparando tu guía…</b><p>Creando resumen, tarjetas y preguntas a partir de tus apuntes.</p></div>`;if(guideError)return `${modalTop}<div class="study-error"><p>${esc(guideError)}</p><button class="btn btn-outline btn-small" onclick="openStudyGuide(${activeGuide.index})">Intentar de nuevo</button></div>`;if(!activeGuide?.guide)return `${modalTop}<p>No hay una guía para mostrar.</p>`;const g=activeGuide.guide,tabs=[['summary','Resumen'],['cards','Tarjetas'],['quiz','Cuestionario']];let body='';if(guideTab==='summary')body=`<div class="study-summary">${g.summary.split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;else if(guideTab==='cards')body=`<p class="study-hint">Toca cada tarjeta para descubrir la respuesta.</p><div class="study-cards">${g.flashcards.map((c,i)=>`<button class="study-card ${flippedCards.has(i)?'flipped':''}" onclick="flipStudyCard(${i})"><small>${flippedCards.has(i)?'RESPUESTA':'CONCEPTO'} · ${i+1}</small><span>${esc(flippedCards.has(i)?c.back:c.front)}</span></button>`).join('')}</div>`;else{const score=Object.entries(quizSelections).filter(([i,a])=>g.quiz[Number(i)]?.answerIndex===a).length;body=`<div class="study-score">${Object.keys(quizSelections).length} de ${g.quiz.length} respondidas · ${score} correctas</div><div class="study-questions">${g.quiz.map((q,i)=>`<section class="study-question"><b>${i+1}. ${esc(q.question)}</b><div class="study-options">${q.options.map((option,j)=>`<button class="${quizSelections[i]===j?'chosen':''} ${quizSelections[i]!==undefined&&j===q.answerIndex?'correct':''} ${quizSelections[i]===j&&j!==q.answerIndex?'incorrect':''}" ${quizSelections[i]!==undefined?'disabled':''} onclick="answerStudyQuestion(${i},${j})">${esc(option)}</button>`).join('')}</div>${quizSelections[i]!==undefined?`<p class="study-explanation">${quizSelections[i]===q.answerIndex?'✓ ¡Correcto!':'La respuesta correcta está marcada arriba.'} ${esc(q.explanation)}</p>`:''}</section>`).join('')}</div>`}return `${modalTop}<div class="study-tabs">${tabs.map(([id,label])=>`<button class="${guideTab===id?'active':''}" onclick="studyModalTab('${id}')">${label}</button>`).join('')}</div><div class="study-content">${body}</div>`}
function renderStudyModal(){const modalEl=document.querySelector('.overlay .modal');if(modalEl?.dataset.study==='yes')modalEl.innerHTML=studyModalHtml()}
function studyModalTab(tab){guideTab=tab;renderStudyModal()}
function flipStudyCard(i){if(flippedCards.has(i))flippedCards.delete(i);else flippedCards.add(i);renderStudyModal()}
function answerStudyQuestion(i,j){if(quizSelections[i]!==undefined)return;quizSelections[i]=j;renderStudyModal()}
function progressPage(){const student=state.user.profile==='alumno',details=state.user.details||{},score=details.quizScore,style=details.learningStyle;const stats=student?`<div class="stat"><div class="stat-label">Preferencia de aprendizaje</div><div class="stat-value" style="font-size:16px">${esc(style?.preferences?.join(' · ')||'Pendiente')}</div></div><div class="stat"><div class="stat-label">Diagnóstico académico</div><div class="stat-value">${score==null?'Pendiente':score+'%'}<small>${score==null?'opcional':'completado'}</small></div></div>`:`<div class="stat"><div class="stat-label">Nivel académico</div><div class="stat-value" style="font-size:16px">${esc(details.level||'Por elegir')}</div></div><div class="stat"><div class="stat-label">Materias</div><div class="stat-value" style="font-size:14px">${esc(details.subjects||'Por agregar')}</div></div>`;return `<div class="view-title"><span class="eyebrow">A TU RITMO</span><h1>${student?'Mi progreso':'Mi espacio docente'}</h1><p>${student?'Tu recorrido de aprendizaje, paso a paso.':'Tus datos y recursos para acompañar tus clases.'}</p></div><div class="grid-stats"><div class="stat"><div class="stat-label">Apuntes reunidos</div><div class="stat-value">${state.notes.length}<small>documentos</small></div></div><div class="stat"><div class="stat-label">${student?'Nivel de estudio':'Perfil'}</div><div class="stat-value" style="font-size:15px">${esc(details.level|| (student?'Por elegir':'Docente'))}</div></div>${stats}</div>${student?`<section class="panel" style="margin-top:18px"><h3>Cómo prefieres aprender</h3><p style="color:var(--muted);font-size:12px;line-height:1.7">${style?`Tu resultado orientativo: <b>${esc(style.preferences.join(' · '))}</b>. Puedes usarlo como inspiración para probar distintas formas de estudio.`:'Este test breve explora tus preferencias; no es una calificación y puedes repetirlo cuando quieras.'}</p><button class="btn btn-small" onclick="startLearningQuiz()">${style?'Repetir test de aprendizaje':'Empezar test de aprendizaje'} →</button></section><section class="panel" style="margin-top:14px"><h3>Diagnóstico académico opcional</h3><p style="color:var(--muted);font-size:12px;line-height:1.7">${score==null?'Responde cinco preguntas generales para obtener una referencia de tu punto de partida.':'Resultado actual: '+score+'%. Puedes repetirlo en cualquier momento.'}</p><button class="btn btn-outline btn-small" onclick="startQuiz()">${score==null?'Empezar diagnóstico':'Repetir diagnóstico'} →</button></section>`:`<section class="panel" style="margin-top:18px"><h3>Herramientas para tus clases</h3><p style="color:var(--muted);font-size:12px;line-height:1.7">Prepara explicaciones, esquemas y materiales con la tutora IA.</p><button class="btn btn-small" onclick="go('chat')">Abrir tutora IA →</button></section>`}`}
function setStudentLevel(level){const form=$('#regform');if(!form)return;const matricula=form.elements.studentId,required=level==='Universidad';matricula.required=required;$('#student-id-required')?.classList.toggle('hidden',!required)}
function studentMatriculaPanel(){const details=state.user?.details||{};if(details.level!=='Universidad'||details.studentId)return '';return `<section class="panel" style="margin-bottom:14px"><h3>Vincula tu matrícula universitaria</h3><p style="color:var(--muted);font-size:12px;line-height:1.7">Si tu docente ya te agregó a una clase, usa la misma matrícula para que aparezca aquí. Solo tendrás que vincularla una vez.</p><form class="class-form" style="grid-template-columns:1fr auto;align-items:end" onsubmit="saveStudentMatricula(event)"><label>Matrícula universitaria<input name="matricula" minlength="3" maxlength="40" required placeholder="Ej. 2026A12345"></label><button class="btn">Guardar y buscar mis clases</button></form></section>`}
function setClassSubjectOptions(level){const list=$('#class-subject-options');if(!list)return;const subjects=subjectsByLevel[level]||[];list.innerHTML=subjects.map(subject=>`<option value="${esc(subject)}"></option>`).join('')}
async function loadClasses(){if(!state.user)return;state.classesLoading=true;renderPage();try{const data=await api('/classes');state.classes=data.classes||[]}catch(error){notify(error.message)}finally{state.classesLoading=false;renderPage()}}
async function createClass(event){event.preventDefault();const form=event.currentTarget,data=Object.fromEntries(new FormData(form));try{const result=await api('/classes',data);state.classes=[result.class,...state.classes];form.reset();setClassSubjectOptions($('#class-level')?.value||'');renderPage();notify('Clase creada. Comparte su código con tus alumnos.')}catch(error){notify(error.message)}}
async function addMatriculas(event,id){event.preventDefault();const form=event.currentTarget;try{const result=await api(`/classes/${id}/matriculas`,{matriculas:form.elements.matriculas.value});state.classes=result.classes||state.classes;renderPage();notify(`Se revisaron ${result.added} matrícula(s); las cuentas existentes quedaron vinculadas.`)}catch(error){notify(error.message)}}

async function saveStudentMatricula(event){event.preventDefault();const form=event.currentTarget;try{const result=await api('/profile/student-id',{matricula:form.elements.matricula.value});state.user=result.user;localStorage.setItem('lumina_user',JSON.stringify(state.user));await loadClasses();notify('Matrícula vinculada. Las clases que te asignaron ya aparecerán aquí.')}catch(error){notify(error.message)}}
function classesPage(){const student=state.user.profile==='alumno';if(state.classesLoading)return `<div class="view-title"><span class="eyebrow">A TU RITMO</span><h1>${student?'Mis clases':'Mis grupos'}</h1><p>Cargando tus clases…</p></div>`;if(student)return `<div class="view-title"><span class="eyebrow">A TU RITMO</span><h1>Mis clases</h1><p>Únete con el código que comparte tu docente.</p></div>${studentMatriculaPanel()}<section class="panel"><form class="class-form" style="grid-template-columns:1fr auto;align-items:end" onsubmit="joinClass(event)"><label>Código de clase<input name="code" minlength="7" maxlength="7" required placeholder="Ej. A4F29C1" style="text-transform:uppercase"></label><button class="btn">Unirme a la clase</button></form></section><div class="class-grid">${state.classes.map(c=>`<article class="class-card"><h3>${esc(c.subject)} · ${esc(c.name)}</h3><div class="class-meta">${esc(c.academicLevel)} · ${esc(c.classType)} · Docente: ${esc(c.teacherName||'Docente')}</div></article>`).join('')||'<section class="panel empty">Aún no tienes clases. Pide un código a tu docente para unirte.</section>'}</div>`;

ne btn-small" style="justify-self:start">Vincular matrículas</button></form><div class="class-roster"><b style="font-size:11px">Alumnos · ${c.students.length}</b>${c.students.map(student=>`<div class="roster-row"><div><b>${esc(student.name||'Pendiente de registro')}</b><small>${student.matricula?`Matrícula: ${esc(student.matricula)}`:student.registered?'Cuenta vinculada':'Esperando registro con esa matrícula'}</small></div><div class="roster-tag">${student.learningPreferences.length?esc(student.learningPreferences.join(' · ')):'Sin preferencia registrada'}</div></div>`).join('')||'<div class="empty">Agrega matrículas o comparte el código de clase para empezar.</div>'}</div></article>`).join('')||'<section class="panel empty">Aún no has creado grupos. Elige una materia y comparte el código con tus alumnos.</section>'}</div>`}
function suggest(s){$('#prompt').value=s;sendMessage()}
async function sendMessage(){const box=$('#prompt'),text=box?.value.trim();if(!text)return;if(/\b(?:crea|crear|genera|generar|dibuja|dibujar|ilustra|ilustrar|diseña|diseñar|haz|hazme)\b.{0,80}\b(?:imagen(?:es)?|infograf[ií]a|ilustraci[oó]n|dibujo|p[oó]ster)\b/i.test(text)){await generateImage();return;}state.messages.push({role:'user',content:text});box.value='';renderPage();const msgs=$('#messages');msgs.scrollTop=msgs.scrollHeight;const b=$('#sendBtn');if(b){b.disabled=true;b.textContent='…'}state.messages.push({role:'assistant',content:'…'});renderPage();try{const d=await api('/chat',{messages:state.messages.slice(0,-1),subject:state.subject,level:state.level||state.user.details?.level});state.messages[state.messages.length-1].content=d.reply}catch(e){state.messages[state.messages.length-1].content=e.message}renderPage();const end=$('#messages');if(end)end.scrollTop=end.scrollHeight}
function mediaPrompt(type){const box=$('#prompt');box.value=type==='video'?'Escribe un guion para un video educativo sobre ':'Ayúdame a crear contenido sobre ';box.focus();notify(type==='video'?'Lúmina puede preparar el guion del video.':'Escribe el tema y elige una herramienta para crearlo.')}
async function generateImage(){const box=$('#prompt'),prompt=box?.value.trim();if(!prompt){box.value='Crea una imagen educativa sobre ';box.focus();notify('Completa el tema y vuelve a tocar “Crear imagen”.');return}state.messages.push({role:'user',content:`Genera una imagen educativa: ${prompt}`});box.value='';state.messages.push({role:'assistant',content:'Creando tu imagen…'});renderPage();const item=state.messages.at(-1);try{const d=await api('/image',{prompt});item.content='Aquí tienes la imagen generada.';item.image=`data:${d.mimeType};base64,${d.image}`}catch(e){item.content=e.message}renderPage();const end=$('#messages');if(end)end.scrollTop=end.scrollHeight}
async function generateAudio(){const box=$('#prompt'),text=box?.value.trim();if(!text){notify('Escribe o pega el texto que quieres convertir en audio.');box?.focus();return}state.messages.push({role:'user',content:'Convierte este texto en audio: '+text});box.value='';state.messages.push({role:'assistant',content:'Preparando el audio…'});renderPage();const item=state.messages.at(-1);try{const d=await api('/audio',{text});item.content='Audio generado. Puedes reproducirlo aquí.';item.audio=`data:${d.mimeType};base64,${d.audio}`}catch(e){item.content=e.message}renderPage();const end=$('#messages');if(end)end.scrollTop=end.scrollHeight}
function makeDiagram(){const q=prompt('¿Qué concepto te gustaría representar en un mapa de ideas?');if(!q)return;state.messages.push({role:'user',content:`Crea un diagrama Mermaid flowchart TD sobre: ${q}. Responde primero con el código Mermaid dentro de un bloque de código y luego una breve explicación.`});state.page='chat';shell();setTimeout(()=>sendDirect(),30)}
async function sendDirect(){state.messages.push({role:'assistant',content:'…'});renderPage();try{const d=await api('/chat',{messages:state.messages.slice(0,-1),subject:state.subject,level:state.level});state.messages.at(-1).content=d.reply}catch(e){state.messages.at(-1).content=e.message}renderPage()}
async function readFile(input){const f=input.files?.[0];if(!f)return;const n={name:f.name,size:(f.size/1024).toFixed(0)+' KB',date:new Date().toLocaleDateString('es-MX'),text:''};if(f.size<=300000&&(f.type.startsWith('text/')||/\.(txt|md|csv|json|html|js|py)$/i.test(f.name)))n.text=await f.text();state.notes.push(n);localStorage.setItem('lumina_notes',JSON.stringify(state.notes));if(n.text&&$('#prompt'))$('#prompt').value=`Ayúdame a estudiar estos apuntes (${f.name}):\n${n.text.slice(0,5000)}`;notify(n.text?'Apunte añadido. Ya puedes crear una guía de estudio.':'Archivo guardado. Para crear una guía, pega también el texto del documento.');renderPage()}
function removeNote(i){state.notes.splice(i,1);localStorage.setItem('lumina_notes',JSON.stringify(state.notes));renderPage()}
const quiz=[{q:'Un problema tiene 3 cajas con 4 lápices cada una. ¿Cuántos lápices hay?',a:['7','12','34','1'],correct:1,why:'Tres grupos de cuatro son 3 × 4 = 12.'},{q:'¿Qué necesita una planta principalmente para producir su alimento?',a:['Luz del sol','Arena','Viento fuerte','Piedras'],correct:0,why:'Las plantas usan la luz solar en la fotosíntesis.'},{q:'Si el agua se congela, ¿qué cambio ocurre?',a:['De líquido a sólido','De sólido a gas','De líquido a gas','No cambia'],correct:0,why:'Al enfriarse, el agua líquida cambia a estado sólido.'},{q:'¿Cuál es la idea principal de un texto?',a:['El título más largo','Lo que el texto comunica principalmente','Una palabra desconocida','La última oración'],correct:1,why:'La idea principal resume lo que el texto comunica en conjunto.'},{q:'Un libro cuesta 80 pesos y tiene 25% de descuento. ¿Cuánto se descuenta?',a:['10 pesos','15 pesos','20 pesos','25 pesos'],correct:2,why:'El 25% es una cuarta parte: 80 ÷ 4 = 20 pesos.'}];

function startLearningQuiz(){if(state.user?.profile!=='alumno'){notify('El test de aprendizaje es solo para estudiantes.');return}state.learningIndex=0;state.learningChoice=null;state.learningAnswers=[];learningQuizModal()}
function learningQuizModal(){if(state.user?.profile!=='alumno')return;const i=state.learningIndex,q=learningQuestions[i];if(!q){finishLearningQuiz();return}modal(`<div class="modal-top"><h2>Cómo prefieres aprender 🌱</h2><button class="close" onclick="closeModal()">×</button></div><p>Elige la opción que más se parece a ti. No hay respuestas correctas o incorrectas; es solo una orientación.</p><div class="quiz-progress"><i style="width:${i/learningQuestions.length*100}%"></i></div><div class="quiz-question">${i+1}. ${q.q}</div><div class="answers">${q.a.map(([label,type])=>`<button onclick="chooseLearningStyle('${type}')" style="${state.learningChoice===type?'border-color:#80967c;background:#eff3eb':''}">${label}</button>`).join('')}</div><div class="quiz-footer"><span>${i+1} de ${learningQuestions.length}</span><button class="btn btn-small" onclick="nextLearningQuestion()">${i===learningQuestions.length-1?'Ver resultado':'Siguiente →'}</button></div>`)}
function chooseLearningStyle(type){state.learningChoice=type;learningQuizModal()}
function nextLearningQuestion(){if(!state.learningChoice){notify('Elige la opción que más se parece a ti.');return}state.learningAnswers.push(state.learningChoice);state.learningIndex++;state.learningChoice=null;learningQuizModal()}
function finishLearningQuiz(){const labels={visual:'Visual',auditivo:'Auditivo',lectura:'Lectura y escritura',kinestesico:'Práctico y kinestésico'},scores={visual:0,auditivo:0,lectura:0,kinestesico:0};state.learningAnswers.forEach(type=>{if(Object.hasOwn(scores,type))scores[type]++});const max=Math.max(...Object.values(scores)),preferences=Object.keys(scores).filter(type=>scores[type]===max).map(type=>labels[type]);state.user.details={...(state.user.details||{}),learningStyle:{preferences,scores,completedAt:new Date().toISOString()}};localStorage.setItem('lumina_user',JSON.stringify(state.user));api('/profile',{details:state.user.details}).catch(()=>{});modal(`<div class="modal-top"><h2>Tu perfil de aprendizaje 🌿</h2><button class="close" onclick="closeModal()">×</button></div><p>Según tus respuestas, tus preferencias más frecuentes son:</p><div style="padding:15px;text-align:center"><div style="font:700 24px Manrope;color:#577158">${preferences.map(esc).join(' · ')}</div><p>Es una orientación, no una etiqueta. Combinar imágenes, conversación, lectura y práctica puede ayudarte a aprender.</p></div><button class="btn" style="width:100%" onclick="closeModal();render()">Continuar a mi espacio</button>`)}
function startQuiz(){if(state.user?.profile!=='alumno'){notify('El diagnóstico es solo para estudiantes.');return}state.quizIndex=0;state.quizScore=0;state.quizChoice=null;quizModal()}
function quizModal(){if(state.user?.profile!=='alumno')return;const i=state.quizIndex;if(i>=quiz.length){const pct=Math.round(state.quizScore/quiz.length*100);state.user.details={...(state.user.details||{}),quizScore:pct,level:state.user.details?.level||state.level};localStorage.setItem('lumina_user',JSON.stringify(state.user));api('/profile',{details:state.user.details}).catch(()=>{});modal(`<div class="modal-top"><h2>Tu diagnóstico inicial 🌱</h2><button class="close" onclick="closeModal()">×</button></div><p>Gracias por pensar cada respuesta. Esto es una orientación, no una calificación.</p><div style="padding:25px;text-align:center"><div style="font:700 42px Manrope;color:#577158">${pct}%</div><p>${pct>=80?'¡Qué buena base! Puedes explorar temas nuevos con confianza.':pct>=60?'Tienes un buen comienzo. La práctica te ayudará a afianzar ideas.':'Este es solo un punto de partida. Cada pregunta nueva es una oportunidad.'}</p></div><button class="btn" style="width:100%" onclick="closeModal();render()">Continuar a mi espacio</button></div>`);return}const q=quiz[i];modal(`<div class="modal-top"><h2>Tu primer diagnóstico</h2><button class="close" onclick="closeModal()">×</button></div><p>Una oportunidad para conocerte como aprendiz. Puedes tomarte tu tiempo.</p><div class="quiz-progress"><i style="width:${i/quiz.length*100}%"></i></div><div class="quiz-question">${i+1}. ${q.q}</div><div class="answers">${q.a.map((a,j)=>`<button onclick="answerQuiz(${j})" style="${state.quizChoice===j?'border-color:#80967c;background:#eff3eb':''}">${a}</button>`).join('')}</div><div class="quiz-footer"><span>${i+1} de ${quiz.length}</span><button class="btn btn-small" onclick="nextQuiz()">${i===quiz.length-1?'Ver resultado':'Siguiente →'}</button></div>`)}

function nextQuiz(){if(state.quizChoice===null){notify('Elige una respuesta para continuar.');return}state.quizIndex++;state.quizChoice=null;quizModal()}
function modal(html){document.querySelector('.overlay')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`)}function closeModal(){document.querySelector('.overlay')?.remove()}
function openLogin(){modal(`<div class="modal-top"><h2>Hola de nuevo 👋</h2><button class="close" onclick="closeModal()">×</button></div><p>Nos da gusto que hayas vuelto.</p><form class="form" onsubmit="login(event)"><label>Correo electrónico<input name="email" type="email" required placeholder="tu@correo.com"></label><label>Contraseña<input name="password" type="password" required minlength="8" placeholder="Al menos 8 caracteres"></label><button class="btn">Iniciar sesión</button><button type="button" class="text-link" onclick="openRegister()">¿Primera vez? Crea tu cuenta</button></form>`)}
function calculateRegistrationAge(value){if(!value)return null;const [year,month,day]=value.split('-').map(Number),birth=new Date(year,month-1,day),today=new Date();if(birth.getFullYear()!==year||birth.getMonth()!==month-1||birth.getDate()!==day||birth>new Date(today.getFullYear(),today.getMonth(),today.getDate()))return null;let age=today.getFullYear()-year;if(today.getMonth()+1<month||(today.getMonth()+1===month&&today.getDate()<day))age--;return age>=0?age:null}
function updateRegistrationAge(){const form=$('#regform');if(!form)return;const birth=form.elements.birth,age=calculateRegistrationAge(birth.value);form.elements.age.value=age===null?'':age;form.elements.age.classList.toggle('derived-invalid',age===null||age<5||age>120);birth.setCustomValidity(age!==null&&(age<5||age>120)?'El registro está disponible para personas de 5 a 120 años.':'')}
function openRegister(){const today=new Date(),maxDate=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;modal(`<div class="modal-top"><h2>Tu camino empieza aquí ✳</h2><button class="close" onclick="closeModal()">×</button></div><p>Crea tu espacio de aprendizaje personalizado.</p><p style="font-size:11px;color:#777">Los campos con <span class="required-star">*</span> son obligatorios.</p><form class="form" id="regform" onsubmit="register(event)"><div class="tabs"><button class="on" type="button" id="tab-alumno" onclick="setProfile('alumno')">Soy estudiante</button><button type="button" id="tab-profesor" onclick="setProfile('profesor')">Soy docente</button></div><input type="hidden" name="profile" value="alumno"><label><span>Nombre completo <i class="required-star">*</i></span><input name="name" required oninvalid="this.form.classList.add('was-validated')" placeholder="Como te gusta que te llamen"></label><label><span>Correo electrónico <i class="required-star">*</i></span><input name="email" type="email" required oninvalid="this.form.classList.add('was-validated')" placeholder="tu@correo.com"></label><label><span>Contraseña <i class="required-star">*</i></span><input name="password" type="password" minlength="8" required oninvalid="this.form.classList.add('was-validated')" placeholder="Al menos 8 caracteres"></label><div class="form-grid"><label><span>Fecha de nacimiento <i class="required-star">*</i></span><input name="birth" type="date" required max="${maxDate}" oninput="updateRegistrationAge()" onchange="updateRegistrationAge()" oninvalid="this.form.classList.add('was-validated')"></label><label><span>Edad <i class="required-star">*</i></span><input name="age" type="number" class="derived-invalid" min="5" max="120" readonly placeholder="Se calcula automáticamente" aria-describedby="age-help"><small id="age-help" style="font-size:10px;color:#81857d;font-weight:400">Se calcula con tu fecha de nacimiento.</small></label></div><div id="student-fields"><div class="form-grid"><label><span>Nivel académico <i class="required-star">*</i></span><select name="level" required onchange="setStudentLevel(this.value)" oninvalid="this.form.classList.add('was-validated')"><option value="">Elige nivel</option>${['Primaria','Secundaria','Preparatoria','Universidad','Posgrado'].map(x=>`<option>${x}</option>`).join('')}</select></label><label><span>Matrícula universitaria <i id="student-id-required" class="required-star hidden">*</i></span><input name="studentId" placeholder="Obligatoria para universidad" oninvalid="this.form.classList.add('was-validated')"></label></div></div><div id="teacher-fields" class="hidden"><label><span>Niveles en los que enseñas <i class="required-star">*</i></span><input name="teachLevels" placeholder="Secundaria, preparatoria..." oninvalid="this.form.classList.add('was-validated')"></label><label>Materias que impartes<input name="subjects" placeholder="Biología, historia..."></label><label>Matrícula docente<input name="teacherId" placeholder="Opcional"></label></div><button class="btn">Crear mi cuenta</button><button type="button" class="text-link" onclick="openLogin()">Ya tengo una cuenta</button></form>`)}
function setProfile(p){const f=$('#regform');f.profile.value=p;$('#tab-alumno').classList.toggle('on',p==='alumno');$('#tab-profesor').classList.toggle('on',p==='profesor');$('#student-fields').classList.toggle('hidden',p!=='alumno');$('#teacher-fields').classList.toggle('hidden',p!=='profesor');f.level.required=p==='alumno';f.teachLevels.required=p==='profesor';setStudentLevel(p==='alumno'?f.level.value:'');f.level.oninvalid=function(){this.form.classList.add('was-validated')};f.teachLevels.oninvalid=function(){this.form.classList.add('was-validated')}}
async function register(e){e.preventDefault();const f=new FormData(e.currentTarget),profile=f.get('profile'),teachLevels=f.get('teachLevels'),details={birth:f.get('birth'),age:Number(f.get('age')),level:profile==='alumno'?f.get('level'):teachLevels,teachLevels:profile==='profesor'?teachLevels:'',studentId:f.get('studentId'),teacherId:f.get('teacherId'),subjects:f.get('subjects')};try{const d=await api('/register',{name:f.get('name'),email:f.get('email'),password:f.get('password'),profile,details});closeModal();saveUser(d);notify('Tu espacio ya está listo. ¡Bienvenida/o!');if(profile==='alumno')setTimeout(startLearningQuiz,500)}catch(e){notify(e.message)}}
async function login(e){e.preventDefault();const f=new FormData(e.currentTarget);try{const d=await api('/login',{email:f.get('email'),password:f.get('password')});closeModal();saveUser(d);notify('¡Qué gusto verte de nuevo!')}catch(e){notify(e.message)}}
function logout(){if(state.token)api('/logout',{}).catch(()=>{});state.token='';state.user=null;state.messages=[];state.classes=[];localStorage.removeItem('lumina_token');localStorage.removeItem('lumina_user');render()}
function readProfileTheme(){const t=localStorage.getItem('lumina_theme');if(t)$('.theme-select')&&($('.theme-select').value=t,setTheme(t))}
if(state.user&&state.token){fetch('/api/me',{headers:{authorization:'Bearer '+state.token}}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{state.user={...state.user,...d.user};render()}).catch(()=>{logout()})}else render();setTimeout(readProfileTheme,30);
</script></body></html>
